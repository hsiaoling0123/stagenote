<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- Viewport 鎖定不許縮放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StageNote - 駐唱看詞助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    /* 禁用所有 Touch 雙擊放大與手勢縮放 */
    *, html, body {
      touch-action: manipulation;
    }
    /* 隱藏和弦切換 CSS */
    body.hide-chords .chord-label {
      display: none !important;
    }
    /* 隱藏標記切換 CSS */
    body.hide-tags .stage-tag {
      display: none !important;
    }
    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 編輯區自動延伸高度 */
    .auto-expand-textarea {
      resize: none;
      overflow-y: hidden;
      min-height: 500px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-12 font-sans select-none">

  <script>
    // 妳的 Firebase 設定檔
    const firebaseConfig = {
      apiKey: "AIzaSyCSC1b6OVWEdNajEG2awFnvWQ5Wb84S620",
      authDomain: "stagenote-25687.firebaseapp.com",
      databaseURL: "https://stagenote-25687-default-rtdb.firebaseio.com",
      projectId: "stagenote-25687",
      storageBucket: "stagenote-25687.firebasestorage.app",
      messagingSenderId: "610245170171",
      appId: "1:610245170171:web:ee4548c6cb08186faef15e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>

  <!-- 常規模式 UI -->
  <div id="normal-view">
    <!-- 頂部功能導覽 -->
    <header class="flex flex-wrap justify-between items-center border-b border-slate-800 pb-4 mb-3 gap-3">
      <div class="flex items-center gap-3">
        <i data-lucide="music" class="text-blue-500 w-7 h-7"></i>
        <h1 class="text-2xl font-extrabold tracking-wide">StageNote</h1>
        <span id="sync-status" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700 font-mono">連線中...</span>
        
        <!-- 頂部新增歌曲按鈕 -->
        <button onclick="createNewSongWithNewTab()" class="bg-blue-600/90 hover:bg-blue-500 text-white text-xs md:text-sm font-bold px-3.5 py-1.5 rounded-xl border border-blue-500/50 active:scale-95 transition flex items-center gap-1 shadow-md shadow-blue-900/30">
          <i data-lucide="plus" class="w-4 h-4"></i> 新增歌曲
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleChords()" class="bg-slate-800 hover:bg-slate-700 text-slate-100 text-sm font-semibold px-4 py-2.5 rounded-xl border border-slate-700 active:scale-95 transition flex items-center gap-1">
          <span id="chord-toggle-text">和弦: 顯</span>
        </button>
        <button onclick="toggleTags()" class="bg-slate-800 hover:bg-slate-700 text-slate-100 text-sm font-semibold px-4 py-2.5 rounded-xl border border-slate-700 active:scale-95 transition flex items-center gap-1">
          <span id="tag-toggle-text">標記: 顯</span>
        </button>
        <button onclick="enterLiveMode()" class="bg-red-600 hover:bg-red-500 text-white text-base font-extrabold px-5 py-2.5 rounded-xl flex items-center gap-1.5 active:scale-95 transition shadow-lg shadow-red-900/50">
          <i data-lucide="mic" class="w-5 h-5"></i> 演出
        </button>
      </div>
    </header>

    <!-- 多頁籤分頁列 (Tabs Bar) -->
    <div class="flex items-center gap-2 mb-5 overflow-x-auto no-scrollbar pb-2 border-b border-slate-800/80" id="tabs-container">
    </div>

    <!-- 主區塊：歌詞 + 右側工具欄 -->
    <div class="flex flex-col md:flex-row gap-6 items-start relative">
      
      <!-- 左側：歌詞編輯區 -->
      <div class="w-full md:w-6/12 lg:w-7/12 flex flex-col gap-4">
        <!-- 歌曲資訊卡片 -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
          <div class="flex justify-between items-start mb-3 gap-2">
            <div>
              <h2 id="song-title" class="text-2xl font-bold text-white">載入中...</h2>
              <p id="song-artist" class="text-slate-400 text-sm">-</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="toggleSearchModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2.5 rounded-xl border border-slate-700 active:scale-95 transition flex items-center gap-1.5 text-sm font-semibold">
                <i data-lucide="search" class="w-4 h-4 text-blue-400"></i>
                <span>搜尋</span>
              </button>
              <select id="song-select" onchange="switchSong(this.value)" class="bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-xl p-2.5 focus:outline-none max-w-[200px] truncate">
              </select>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 text-xs font-mono">
            <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">原Key: <b id="song-key" class="text-yellow-400">-</b></span>
            <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">常用Key: <b id="song-pref-key" class="text-emerald-400">-</b></span>
            <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">BPM: <b id="song-bpm" class="text-blue-400">-</b></span>
          </div>
        </div>

        <!-- 全幅打字歌詞區 -->
        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 shadow-xl relative focus-within:border-blue-500/80 transition">
          <div class="text-[11px] text-slate-500 mb-2 font-mono flex justify-between items-center">
            <span>✏️ 點擊下方直接打字修改歌詞 (支援 [C]和弦 格式)</span>
          </div>
          <textarea id="input-lyrics" oninput="autoSaveLyrics(); adjustTextareaHeight(this);" class="auto-expand-textarea w-full bg-transparent text-2xl text-slate-100 font-medium font-sans leading-relaxed tracking-wider focus:outline-none placeholder-slate-600" placeholder="點擊這裡直接打字輸入歌詞..."></textarea>
        </div>
      </div>

      <!-- 右側：工具欄 -->
      <div class="w-full md:w-6/12 lg:w-5/12 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-5 shadow-2xl sticky top-4 h-fit z-30 shrink-0">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-blue-400"></i>
            歌曲參數與工具
          </h3>
          <span class="text-xs text-emerald-400 font-mono font-semibold bg-emerald-950/60 px-2.5 py-1 rounded-full border border-emerald-800">即時同步</span>
        </div>

        <!-- 歌名與歌手 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm font-medium text-slate-300 mb-1.5 block">歌名</label>
            <input id="input-title" type="text" oninput="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-base text-white focus:outline-none focus:border-blue-500 transition">
          </div>
          <div>
            <label class="text-sm font-medium text-slate-300 mb-1.5 block">歌手</label>
            <input id="input-artist" type="text" oninput="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-base text-white focus:outline-none focus:border-blue-500 transition">
          </div>
        </div>

        <!-- Key 選單 & BPM -->
        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="text-xs font-medium text-slate-300 mb-1.5 block">原 Key</label>
            <select id="input-key" onchange="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2.5 text-base font-bold text-yellow-400 focus:outline-none focus:border-blue-500 transition">
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-300 mb-1.5 block">常用 Key</label>
            <select id="input-pref-key" onchange="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2.5 text-base font-bold text-emerald-400 focus:outline-none focus:border-blue-500 transition">
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-300 mb-1.5 block">BPM</label>
            <input id="input-bpm" type="text" placeholder="120" oninput="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2.5 text-base font-bold text-blue-400 focus:outline-none focus:border-blue-500 transition">
          </div>
        </div>

        <!-- 快速標記區與新增自訂標記 -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm text-blue-400 font-bold">⚡ 快速插入演出標記</label>
            <span class="text-[11px] text-slate-500">（長按標記可刪除）</span>
          </div>
          
          <div id="tags-list-container" class="flex flex-wrap gap-2 max-h-56 overflow-y-auto p-3 bg-slate-950 rounded-xl border border-slate-800 mb-3">
            <!-- 動態渲染標記 -->
          </div>

          <!-- 自訂標記輸入區 -->
          <div class="flex gap-2">
            <input id="custom-tag-input" type="text" placeholder="輸入自訂標記 (如: 🎸 換吉他)..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <button onclick="addCustomTag()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2 rounded-xl transition active:scale-95 shrink-0 flex items-center gap-1">
              <i data-lucide="plus" class="w-4 h-4"></i> 新增
            </button>
          </div>
        </div>

        <button onclick="saveCurrentSong()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-base py-3.5 rounded-xl transition active:scale-95 shadow-lg shadow-blue-900/50 mt-1">
          💾 同步儲存至雲端
        </button>
      </div>

    </div>
  </div>

  <!-- 🎤 演出模式 (Live Mode) -->
  <div id="live-view" class="fixed inset-0 bg-black z-50 hidden flex flex-col h-screen w-screen overflow-hidden">
    
    <!-- 100% 強制獨立頂層工具欄 -->
    <div class="bg-black/95 backdrop-blur-xl border-b border-zinc-800 p-4 space-y-3 shadow-2xl shrink-0 z-50">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="shrink-0 bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-widest">LIVE</span>
          <h2 id="live-title" class="text-3xl md:text-4xl font-black text-white truncate tracking-wide">歌曲名稱</h2>
        </div>
        
        <!-- 大幅放大的 Key & BPM 面板 -->
        <div class="shrink-0">
          <span id="live-info" class="text-base md:text-xl font-mono font-extrabold text-zinc-100 bg-zinc-900 px-4 py-2 rounded-2xl border border-zinc-700 shadow-xl tracking-wide block">
            原: - | 常用: -
          </span>
        </div>
      </div>

      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-1 border-b border-zinc-800/80" id="live-tabs-container">
      </div>

      <div class="flex items-center justify-between gap-2 pt-1">
        <div class="flex items-center gap-1.5 bg-zinc-900 px-3.5 py-1.5 rounded-xl border border-zinc-800 text-sm text-zinc-300">
          <span class="text-zinc-400 text-xs font-bold">速度</span>
          <button onclick="adjustSpeed(-1)" class="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 active:scale-90 rounded-lg flex items-center justify-center font-bold text-zinc-100 text-lg">-</button>
          <span id="speed-label" class="w-7 text-center font-mono font-bold text-blue-400 text-base">5</span>
          <button onclick="adjustSpeed(1)" class="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 active:scale-90 rounded-lg flex items-center justify-center font-bold text-zinc-100 text-lg">+</button>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="toggleChords()" class="bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-200 px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-semibold border border-zinc-800 transition">
            <span id="live-chord-toggle-text">和弦: 顯</span>
          </button>
          <button onclick="toggleTags()" class="bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-200 px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-semibold border border-zinc-800 transition">
            <span id="live-tag-toggle-text">標記: 顯</span>
          </button>
          <button id="live-scroll-btn" onclick="toggleLiveScroll()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-5 py-2.5 rounded-xl text-xs md:text-sm font-extrabold transition shadow-lg shadow-blue-900/40">
            開始滾動
          </button>
          <button onclick="exitLiveMode()" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-zinc-300 px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-semibold border border-zinc-700 transition">
            退出
          </button>
        </div>
      </div>
    </div>

    <!-- 獨立滾動歌詞區域 -->
    <div id="live-scroll-area" class="flex-1 overflow-y-auto px-6 pt-6 pb-60">
      <div id="live-lyrics-container" class="space-y-8 text-3xl font-bold tracking-wide text-white">
      </div>
    </div>
  </div>

  <!-- 🔍 搜尋視窗 Modal -->
  <div id="search-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-start justify-center p-4 pt-16">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-4 flex flex-col gap-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2 text-blue-400">
          <i data-lucide="search" class="w-5 h-5"></i>
          <h3 class="text-base font-bold text-white">搜尋曲目 (替換當前分頁)</h3>
        </div>
        <button onclick="toggleSearchModal()" class="text-slate-400 hover:text-white p-1"><i data-lucide="x"></i></button>
      </div>

      <div class="relative">
        <input id="search-input" type="text" oninput="filterSongs()" placeholder="輸入歌名或歌手關鍵字..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div id="search-results" class="max-h-60 overflow-y-auto divide-y divide-slate-800/60 rounded-xl bg-slate-950 border border-slate-800 p-1">
      </div>
    </div>
  </div>

  <script>
    // 攔截 Safari / Chrome 觸控雙擊縮放 (Double-tap zoom prevention)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    let songs = [];
    let tabs = [0];
    let activeTabIndex = 0;
    
    let isScrolling = false;
    let scrollTimer = null;
    let speedLevel = 5;
    let showChords = true;
    let showTags = true;

    // 預設標記清單
    let customTags = [
      '🫁 換氣', '🎤 Mic拉遠', '🎤 Mic靠近', '🔥 情緒', '❤️ 微笑', 
      '👀 看觀眾', '🤝 互動', '🎸 吉他Solo', '🥁 鼓Fill', '⬆️ 升Key', 
      '⬇️ 降Key', '⭐ 重點', '⚠️ 小心高音', '😌 放輕鬆'
    ];

    const allKeys = [
      "-",
      "C", "C# / Db", "D", "D# / Eb", "E", "F", "F# / Gb", "G", "G# / Ab", "A", "A# / Bb", "B",
      "Am", "A#m / Bbm", "Bm", "Cm", "C#m", "Dm", "D#m / Ebm", "Em", "Fm", "F#m", "Gm", "G#m"
    ];

    function getScrollInterval() {
      return Math.max(10, 90 - (speedLevel * 8));
    }

    function performLiveScroll() {
      const liveScrollArea = document.getElementById('live-scroll-area');
      if (liveScrollArea) {
        liveScrollArea.scrollTop += 1;
      }
    }

    function adjustTextareaHeight(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    window.onload = () => {
      lucide.createIcons();
      initKeySelectOptions();

      // 監聽 Firebase 標記清單
      db.ref('custom_tags').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          customTags = Array.isArray(data) ? data : Object.values(data);
        }
        renderTagsList();
      });

      // 監聽 Firebase 歌曲資料
      db.ref('songs').on('value', (snapshot) => {
        const data = snapshot.val();
        document.getElementById('sync-status').innerText = '雲端已同步';
        document.getElementById('sync-status').className = 'text-xs bg-emerald-950 text-emerald-400 px-3 py-1 rounded-full border border-emerald-800 font-mono';

        if (data) {
          songs = Array.isArray(data) ? data : Object.values(data);
        } else {
          songs = [{
            id: "song-1",
            title: "愛人錯過",
            artist: "告五人",
            key: "C",
            prefKey: "C",
            bpm: "120",
            viewCount: 1,
            lyrics: `作詞：潘雲安  作曲：潘雲安\n\n[C]我肯定在幾百年前就說過愛你\n\n[G]只是你忘了\n\n[Am]我也沒想起\n\n⭐ 重點\n\n[F]我肯定在幾百年前就說過愛你`
          }];
          db.ref('songs').set(songs);
        }
        
        updateSongSelectOptions();
        renderTabs();
        renderCurrentTabSong();
      });
    };

    // 更新下拉選單（包含 BPM、原Key 與 常用Key 資訊）
    function updateSongSelectOptions() {
      const select = document.getElementById('song-select');
      
      const sortedSongsWithIndex = songs.map((s, idx) => ({ ...s, originalIndex: idx }))
        .sort((a, b) => (b.viewCount || 0) - (a.viewCount || 0));

      const optionsHtml = sortedSongsWithIndex.map((s, i) => {
        const prefix = i === 0 && (s.viewCount || 0) > 0 ? '🔥 ' : '';
        const bpmStr = s.bpm ? `${s.bpm} ` : '';
        const origKeyStr = s.key && s.key !== '-' ? `原:${s.key}` : '';
        const prefKeyStr = s.prefKey && s.prefKey !== '-' ? `樂:${s.prefKey}` : '';
        
        let keyInfo = [origKeyStr, prefKeyStr].filter(Boolean).join(' ');
        if (keyInfo) keyInfo = ` (${keyInfo})`;

        return `<option value="${s.originalIndex}">${prefix}${bpmStr}${s.title}${keyInfo}</option>`;
      }).join('') + '<option value="new">+ 新增歌曲</option>';

      select.innerHTML = optionsHtml;
    }

    function incrementSongViewCount(index) {
      if (songs[index]) {
        songs[index].viewCount = (songs[index].viewCount || 0) + 1;
        db.ref(`songs/${index}/viewCount`).set(songs[index].viewCount);
      }
    }

    // 渲染演出標記按鈕清單
    function renderTagsList() {
      const container = document.getElementById('tags-list-container');
      container.innerHTML = customTags.map((tag, idx) => `
        <button 
          id="tag-btn-${idx}"
          onclick="handleTagClick('${tag}', ${idx})"
          oncontextmenu="handleTagContextMenu(event, '${tag}', ${idx})"
          ontouchstart="handleTagTouchStart('${tag}', ${idx})"
          ontouchend="handleTagTouchEnd()"
          ontouchmove="handleTagTouchEnd()"
          class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3.5 py-2 rounded-xl text-slate-100 border border-slate-700 transition"
        >
          ${tag}
        </button>
      `).join('');
    }

    let longPressTimer = null;
    let isLongPressTriggered = false;

    function handleTagTouchStart(tag, index) {
      isLongPressTriggered = false;
      longPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        confirmDeleteCustomTag(tag, index);
      }, 500);
    }

    function handleTagTouchEnd() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function handleTagClick(tag, index) {
      if (isLongPressTriggered) {
        isLongPressTriggered = false;
        return;
      }
      insertTag(tag);
    }

    function handleTagContextMenu(e, tag, index) {
      e.preventDefault();
      confirmDeleteCustomTag(tag, index);
    }

    function confirmDeleteCustomTag(tag, index) {
      if (confirm(`確定要刪除標記 『${tag}』 嗎？`)) {
        customTags.splice(index, 1);
        db.ref('custom_tags').set(customTags);
      }
    }

    function addCustomTag() {
      const input = document.getElementById('custom-tag-input');
      const newTag = input.value.trim();
      if (!newTag) return;

      if (!customTags.includes(newTag)) {
        customTags.push(newTag);
        db.ref('custom_tags').set(customTags);
      }
      input.value = '';
    }

    function initKeySelectOptions() {
      const keySelect = document.getElementById('input-key');
      const prefKeySelect = document.getElementById('input-pref-key');
      const optionsHtml = allKeys.map(k => `<option value="${k}">${k}</option>`).join('');
      
      keySelect.innerHTML = optionsHtml;
      prefKeySelect.innerHTML = optionsHtml;
    }

    function autoSaveLyrics() {
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex === 'new' || !songs[currentSongIndex]) return;

      const textareaVal = document.getElementById('input-lyrics').value;
      if (showChords) {
        songs[currentSongIndex].lyrics = textareaVal;
      }
    }

    function autoSaveField() {
      const title = document.getElementById('input-title').value;
      const artist = document.getElementById('input-artist').value;
      const key = document.getElementById('input-key').value;
      const prefKey = document.getElementById('input-pref-key').value;
      const bpm = document.getElementById('input-bpm').value;

      document.getElementById('song-title').innerText = title || '新歌曲';
      document.getElementById('song-artist').innerText = artist || '-';
      document.getElementById('song-key').innerText = key;
      document.getElementById('song-pref-key').innerText = prefKey;
      document.getElementById('song-bpm').innerText = bpm || '-';

      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        songs[currentSongIndex].title = title;
        songs[currentSongIndex].artist = artist;
        songs[currentSongIndex].key = key;
        songs[currentSongIndex].prefKey = prefKey;
        songs[currentSongIndex].bpm = bpm;
      }
    }

    // --- 分頁邏輯 (Tabs Logic) ---
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      const liveContainer = document.getElementById('live-tabs-container');

      const tabsHTML = tabs.map((songIndex, tIdx) => {
        let title = '新歌曲';
        if (songIndex !== 'new' && songs[songIndex]) {
          title = songs[songIndex].title;
        }
        
        const isActive = tIdx === activeTabIndex;
        const activeClass = isActive 
          ? 'bg-blue-600 text-white font-extrabold border-blue-500 shadow-lg shadow-blue-900/40' 
          : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border-slate-700';

        return `
          <div onclick="switchTab(${tIdx})" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border text-base cursor-pointer shrink-0 transition ${activeClass}">
            <span class="max-w-[120px] truncate">${title}</span>
            ${tabs.length > 1 ? `<button onclick="event.stopPropagation(); closeTab(${tIdx})" class="hover:text-red-300 p-1 rounded-md transition"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
          </div>
        `;
      }).join('') + `
        <button onclick="addNewTab()" class="bg-slate-800 hover:bg-slate-700 text-blue-400 p-2.5 rounded-xl border border-slate-700 shrink-0 flex items-center justify-center transition active:scale-95">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
      `;

      container.innerHTML = tabsHTML;
      if (liveContainer) liveContainer.innerHTML = tabsHTML;
      lucide.createIcons();
    }

    function switchTab(tIdx) {
      if (isScrolling) toggleLiveScroll();
      activeTabIndex = tIdx;
      renderTabs();
      renderCurrentTabSong();
    }

    function addNewTab() {
      tabs.push(0);
      activeTabIndex = tabs.length - 1;
      renderTabs();
      renderCurrentTabSong();
      toggleSearchModal();
    }

    // 專門為「新增歌曲」開立獨立分頁的函式
    function createNewSongWithNewTab() {
      tabs.push('new');
      activeTabIndex = tabs.length - 1;
      renderTabs();
      
      openNewSongForm();
    }

    function closeTab(tIdx) {
      if (tabs.length <= 1) return;
      tabs.splice(tIdx, 1);
      if (activeTabIndex >= tabs.length) {
        activeTabIndex = tabs.length - 1;
      }
      renderTabs();
      renderCurrentTabSong();
    }

    function renderCurrentTabSong() {
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex === 'new') {
        openNewSongForm();
      } else if (songs[currentSongIndex]) {
        renderSong(songs[currentSongIndex]);
        document.getElementById('song-select').value = currentSongIndex;
        populateRightSidebarForm(songs[currentSongIndex]);
      }
    }

    function populateRightSidebarForm(song) {
      document.getElementById('input-title').value = song.title || '';
      document.getElementById('input-artist').value = song.artist || '';
      document.getElementById('input-key').value = song.key || '-';
      document.getElementById('input-pref-key').value = song.prefKey || '-';
      document.getElementById('input-bpm').value = song.bpm || '';
      
      const lyricsInput = document.getElementById('input-lyrics');
      let rawLyrics = song.lyrics || '';
      lyricsInput.value = showChords ? rawLyrics : rawLyrics.replace(/\[.*?\]/g, '');
      adjustTextareaHeight(lyricsInput);
    }

    // --- 搜尋與歌曲切換 ---
    function toggleSearchModal() {
      const modal = document.getElementById('search-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        const input = document.getElementById('search-input');
        input.value = '';
        input.focus();
        filterSongs();
      }
    }

    function filterSongs() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('search-results');
      
      const filtered = songs.map((song, index) => ({ song, index }))
        .sort((a, b) => (b.song.viewCount || 0) - (a.song.viewCount || 0))
        .filter(item => {
          const title = (item.song.title || '').toLowerCase();
          const artist = (item.song.artist || '').toLowerCase();
          return title.includes(query) || artist.includes(query);
        });

      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">找不到相符歌曲</div>`;
        return;
      }

      // 搜尋 Modal 支援 HTML 渲染，因此可以使用彩色標籤
      resultsContainer.innerHTML = filtered.map(item => `
        <div onclick="selectSearchResult(${item.index})" class="p-3 hover:bg-slate-800/80 active:bg-slate-700 cursor-pointer flex justify-between items-center transition">
          <div class="flex items-center gap-2">
            ${item.song.bpm ? `<span class="text-xs font-mono font-bold text-blue-400 bg-blue-950/80 border border-blue-800/60 px-2 py-0.5 rounded-md">${item.song.bpm}</span>` : ''}
            <div>
              <div class="text-base font-bold text-slate-100">${item.song.title}</div>
              <div class="text-xs text-slate-400">${item.song.artist || '-'}</div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 text-xs font-mono">
            ${item.song.key && item.song.key !== '-' ? `<span class="bg-slate-800 text-yellow-400 px-2 py-1 rounded border border-slate-700 font-bold">原:${item.song.key}</span>` : ''}
            ${item.song.prefKey && item.song.prefKey !== '-' ? `<span class="bg-slate-800 text-emerald-400 px-2 py-1 rounded border border-slate-700 font-bold">樂:${item.song.prefKey}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    function selectSearchResult(index) {
      incrementSongViewCount(index);
      tabs[activeTabIndex] = index;
      renderTabs();
      renderSong(songs[index]);
      document.getElementById('song-select').value = index;
      populateRightSidebarForm(songs[index]);
      toggleSearchModal();
    }

    function toggleChords() {
      showChords = !showChords;
      document.body.classList.toggle('hide-chords', !showChords);

      const normalText = document.getElementById('chord-toggle-text');
      const liveText = document.getElementById('live-chord-toggle-text');

      const label = showChords ? '和弦: 顯' : '和弦: 隱';
      if (normalText) normalText.innerText = label;
      if (liveText) liveText.innerText = label;

      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        const lyricsInput = document.getElementById('input-lyrics');
        let rawLyrics = songs[currentSongIndex].lyrics || '';
        lyricsInput.value = showChords ? rawLyrics : rawLyrics.replace(/\[.*?\]/g, '');
        adjustTextareaHeight(lyricsInput);
      }
    }

    function toggleTags() {
      showTags = !showTags;
      document.body.classList.toggle('hide-tags', !showTags);

      const normalText = document.getElementById('tag-toggle-text');
      const liveText = document.getElementById('live-tag-toggle-text');

      const label = showTags ? '標記: 顯' : '標記: 隱';
      if (normalText) normalText.innerText = label;
      if (liveText) liveText.innerText = label;
    }

    function switchSong(value) {
      if (value === 'new') {
        createNewSongWithNewTab();
      } else {
        const index = parseInt(value);
        incrementSongViewCount(index);
        tabs[activeTabIndex] = index;
        renderTabs();
        renderSong(songs[index]);
        populateRightSidebarForm(songs[index]);
      }
    }

    function renderSong(song) {
      document.getElementById('song-title').innerText = song.title;
      document.getElementById('song-artist').innerText = song.artist || '-';
      document.getElementById('song-key').innerText = song.key || '-';
      document.getElementById('song-pref-key').innerText = song.prefKey || '-';
      document.getElementById('song-bpm').innerText = song.bpm || '-';

      const lyricsInput = document.getElementById('input-lyrics');
      let rawLyrics = song.lyrics || '';
      lyricsInput.value = showChords ? rawLyrics : rawLyrics.replace(/\[.*?\]/g, '');
      adjustTextareaHeight(lyricsInput);

      document.getElementById('live-title').innerText = song.title;
      document.getElementById('live-info').innerHTML = `原: <b class="text-yellow-400 text-lg md:text-xl">${song.key || '-'}</b> | 常用: <b class="text-emerald-400 text-lg md:text-xl">${song.prefKey || '-'}</b> | BPM: <b class="text-blue-400 text-lg md:text-xl">${song.bpm || '-'}</b>`;
      document.getElementById('live-lyrics-container').innerHTML = generateLyricsHTML(song.lyrics, true);
    }

    function generateLyricsHTML(lyricsText, isLive = false) {
      if (!lyricsText) return '';
      const lines = lyricsText.split('\n');

      return lines.map(line => {
        const trimmed = line.trim();
        const hasEmoji = /[\u{1F300}-\u{1F9FF}]/u.test(trimmed);
        
        const isTag = customTags.some(tag => trimmed.includes(tag.replace(/[\u{1F300}-\u{1F9FF}]/u, '').trim()));

        if ((hasEmoji || isTag) && !trimmed.includes('[')) {
          return `<div class="stage-tag text-amber-400 font-bold ${isLive ? 'text-2xl py-1' : 'text-lg py-0.5'} flex items-center gap-1">${trimmed}</div>`;
        }

        let lineHtml = '<div class="flex flex-wrap items-end gap-x-3 my-2">';
        const regex = /\[(.*?)\]([^\[]*)/g;
        let match;
        let hasChord = false;

        while ((match = regex.exec(line)) !== null) {
          hasChord = true;
          lineHtml += `
            <div class="flex flex-col items-start">
              <span class="chord-label ${isLive ? 'text-blue-400 font-black text-2xl' : 'text-blue-400 font-bold text-xl'} leading-none mb-1">${match[1]}</span>
              <span>${match[2]}</span>
            </div>
          `;
        }

        if (!hasChord) {
          lineHtml += `<span>${line}</span>`;
        }
        lineHtml += '</div>';
        return lineHtml;
      }).join('');
    }

    function insertTag(tagText) {
      const textarea = document.getElementById('input-lyrics');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      
      const insertContent = `\n${tagText}\n`;
      textarea.value = text.substring(0, start) + insertContent + text.substring(end);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + insertContent.length;
      adjustTextareaHeight(textarea);
      autoSaveLyrics();
    }

    function enterLiveMode() {
      document.getElementById('normal-view').classList.add('hidden');
      document.getElementById('live-view').classList.remove('hidden');
      
      const liveScrollArea = document.getElementById('live-scroll-area');
      if (liveScrollArea) liveScrollArea.scrollTop = 0;
    }

    function exitLiveMode() {
      if (isScrolling) toggleLiveScroll();
      document.getElementById('live-view').classList.add('hidden');
      document.getElementById('normal-view').classList.remove('hidden');
    }

    function adjustSpeed(change) {
      speedLevel = Math.max(1, Math.min(10, speedLevel + change));
      document.getElementById('speed-label').innerText = speedLevel;
      
      if (isScrolling) {
        clearInterval(scrollTimer);
        scrollTimer = setInterval(performLiveScroll, getScrollInterval());
      }
    }

    function toggleLiveScroll() {
      isScrolling = !isScrolling;
      const liveBtn = document.getElementById('live-scroll-btn');

      if (isScrolling) {
        if (liveBtn) {
          liveBtn.classList.replace('bg-blue-600', 'bg-amber-500');
          liveBtn.innerText = '暫停滾動';
        }
        scrollTimer = setInterval(performLiveScroll, getScrollInterval());
      } else {
        if (liveBtn) {
          liveBtn.classList.replace('bg-amber-500', 'bg-blue-600');
          liveBtn.innerText = '開始滾動';
        }
        clearInterval(scrollTimer);
      }
    }

    // 清空表單供填寫新歌
    function openNewSongForm() {
      document.getElementById('song-title').innerText = '新歌曲';
      document.getElementById('song-artist').innerText = '-';
      document.getElementById('song-key').innerText = '-';
      document.getElementById('song-pref-key').innerText = '-';
      document.getElementById('song-bpm').innerText = '-';

      document.getElementById('input-title').value = '';
      document.getElementById('input-artist').value = '';
      document.getElementById('input-key').value = '-';
      document.getElementById('input-pref-key').value = '-';
      document.getElementById('input-bpm').value = '';
      
      const lyricsInput = document.getElementById('input-lyrics');
      lyricsInput.value = '';
      adjustTextareaHeight(lyricsInput);
      
      document.getElementById('input-title').focus();
    }

    function saveCurrentSong() {
      const title = document.getElementById('input-title').value || '未命名歌曲';
      const artist = document.getElementById('input-artist').value || '-';
      const key = document.getElementById('input-key').value || '-';
      const prefKey = document.getElementById('input-pref-key').value || '-';
      const bpm = document.getElementById('input-bpm').value || '-';
      const lyrics = document.getElementById('input-lyrics').value || '';
      
      const currentSongIndex = tabs[activeTabIndex];
      const currentViewCount = (currentSongIndex !== 'new' && songs[currentSongIndex] && songs[currentSongIndex].viewCount) || 0;

      const updatedSong = { 
        id: 'song-' + Date.now(), 
        title, 
        artist, 
        key, 
        prefKey, 
        bpm, 
        lyrics,
        viewCount: currentViewCount
      };

      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        songs[currentSongIndex] = updatedSong;
      } else {
        // 全新歌曲新增入陣列
        songs.push(updatedSong);
        tabs[activeTabIndex] = songs.length - 1; // 綁定分頁指針到這首新歌
      }

      db.ref('songs').set(songs).then(() => {
        renderTabs();
        renderCurrentTabSong();
      });
    }
  </script>
</body>
</html>
