<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StageNote - 駐唱看詞助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    /* 隱藏和弦切換 CSS */
    body.hide-chords .chord-label {
      display: none !important;
    }
    /* 隱藏標記切換 CSS */
    body.hide-tags .stage-tag {
      display: none !important;
    }
    /* 隱藏滾動條但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 編輯區自動延伸高度 */
    .auto-expand-textarea {
      resize: none;
      overflow-y: hidden;
      min-height: 450px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-28 font-sans select-none">

  <div id="normal-view">
    <header class="flex justify-between items-center border-b border-slate-800 pb-3 mb-2">
      <div class="flex items-center gap-2">
        <i data-lucide="music" class="text-blue-500"></i>
        <h1 class="text-xl font-bold tracking-wide">StageNote</h1>
        <span id="sync-status" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">連線中...</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleChords()" class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 active:scale-95 transition">
          <span id="chord-toggle-text">和弦: 顯</span>
        </button>
        <button onclick="toggleTags()" class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 active:scale-95 transition">
          <span id="tag-toggle-text">標記: 顯</span>
        </button>
        <button onclick="enterLiveMode()" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 active:scale-95 transition shadow-lg shadow-red-900/40">
          <i data-lucide="mic" class="w-3.5 h-3.5"></i> 演出
        </button>
      </div>
    </header>

    <div class="flex items-center gap-1 mb-4 overflow-x-auto no-scrollbar pb-1 border-b border-slate-800/80" id="tabs-container">
    </div>

    <div class="flex flex-col md:flex-row gap-6 items-start relative">
      
      <div class="w-full md:w-6/12 lg:w-7/12 flex flex-col gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
          <div class="flex justify-between items-start mb-3 gap-2">
            <div>
              <h2 id="song-title" class="text-2xl font-bold text-white">載入中...</h2>
              <p id="song-artist" class="text-slate-400 text-sm">-</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="toggleSearchModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-lg border border-slate-700 active:scale-95 transition flex items-center gap-1 text-xs">
                <i data-lucide="search" class="w-4 h-4 text-blue-400"></i>
                <span>搜尋</span>
              </button>
              <select id="song-select" onchange="switchSong(this.value)" class="bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg p-2 focus:outline-none max-w-[140px] truncate">
              </select>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 text-xs font-mono">
            <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">原Key: <b id="song-key" class="text-yellow-400">-</b></span>
            <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">常用Key: <b id="song-pref-key" class="text-emerald-400">-</b></span>
            <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">BPM: <b id="song-bpm" class="text-blue-400">-</b></span>
          </div>
        </div>

        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 shadow-xl relative focus-within:border-blue-500/80 transition">
          <div class="text-[11px] text-slate-500 mb-2 font-mono flex justify-between items-center">
            <span>✏️ 點擊下方直接打字修改歌詞 (支援 [C]和弦 格式)</span>
          </div>
          <textarea id="input-lyrics" oninput="autoSaveLyrics(); adjustTextareaHeight(this);" class="auto-expand-textarea w-full bg-transparent text-2xl text-slate-100 font-medium font-sans leading-relaxed tracking-wider focus:outline-none placeholder-slate-600" placeholder="點擊這裡直接打字輸入歌詞..."></textarea>
        </div>
      </div>

      <div class="w-full md:w-6/12 lg:w-5/12 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-5 shadow-2xl sticky top-4 h-fit z-30 shrink-0">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-5 h-5 text-blue-400"></i>
            歌曲參數與工具
          </h3>
          <span class="text-xs text-emerald-400 font-mono font-semibold bg-emerald-950/60 px-2.5 py-1 rounded-full border border-emerald-800">即時同步</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm font-medium text-slate-300 mb-1.5 block">歌名</label>
            <input id="input-title" type="text" oninput="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-base text-white focus:outline-none focus:border-blue-500 transition">
          </div>
          <div>
            <label class="text-sm font-medium text-slate-300 mb-1.5 block">歌手</label>
            <input id="input-artist" type="text" oninput="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-base text-white focus:outline-none focus:border-blue-500 transition">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="text-xs font-medium text-slate-300 mb-1.5 block">原 Key</label>
            <select id="input-key" onchange="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2.5 text-base font-bold text-yellow-400 focus:outline-none focus:border-blue-500 transition">
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-300 mb-1.5 block">常用 Key</label>
            <select id="input-pref-key" onchange="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2.5 text-base font-bold text-emerald-400 focus:outline-none focus:border-blue-500 transition">
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-300 mb-1.5 block">BPM</label>
            <input id="input-bpm" type="text" placeholder="120" oninput="autoSaveField()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2.5 text-base font-bold text-blue-400 focus:outline-none focus:border-blue-500 transition">
          </div>
        </div>

        <div>
          <label class="text-sm text-blue-400 mb-2 block font-bold flex items-center gap-1">
            <span>⚡ 快速插入演出標記</span>
          </label>
          <div class="flex flex-wrap gap-2 max-h-56 overflow-y-auto p-3 bg-slate-950 rounded-xl border border-slate-800">
            <button onclick="insertTag('🫁 換氣')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🫁 換氣</button>
            <button onclick="insertTag('🎤 Mic拉遠')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🎤 Mic拉遠</button>
            <button onclick="insertTag('🎤 Mic靠近')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🎤 Mic靠近</button>
            <button onclick="insertTag('🔥 情緒')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🔥 情緒</button>
            <button onclick="insertTag('❤️ 微笑')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">❤️ 微笑</button>
            <button onclick="insertTag('👀 看觀眾')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">👀 看觀眾</button>
            <button onclick="insertTag('🤝 互動')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🤝 互動</button>
            <button onclick="insertTag('🎸 吉他Solo')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🎸 Solo</button>
            <button onclick="insertTag('🥁 鼓Fill')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">🥁 鼓Fill</button>
            <button onclick="insertTag('⬆️ 升Key')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">⬆️ 升Key</button>
            <button onclick="insertTag('⬇️ 降Key')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">⬇️ 降Key</button>
            <button onclick="insertTag('⭐ 重點')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">⭐ 重點</button>
            <button onclick="insertTag('⚠️ 小心高音')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">⚠️ 小心高音</button>
            <button onclick="insertTag('😌 放輕鬆')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sm font-medium px-3 py-2 rounded-lg text-slate-100 border border-slate-700 transition">😌 放輕鬆</button>
          </div>
        </div>

        <button onclick="saveCurrentSong()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-base py-3.5 rounded-xl transition active:scale-95 shadow-lg shadow-blue-900/50 mt-1">
          💾 同步儲存至雲端
        </button>
      </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 flex justify-around items-center z-40">
      <button onclick="changeFontSize(-2)" class="p-3 bg-slate-800 rounded-full active:scale-95 transition">
        <i data-lucide="zoom-out"></i>
      </button>
      <button id="scroll-btn" onclick="toggleScroll()" class="flex items-center gap-2 px-6 py-3 rounded-full font-bold bg-blue-600 text-white active:scale-95 transition">
        <i data-lucide="play" id="scroll-icon"></i>
        <span id="scroll-text">開始滾動</span>
      </button>
      <button onclick="changeFontSize(2)" class="p-3 bg-slate-800 rounded-full active:scale-95 transition">
        <i data-lucide="zoom-in"></i>
      </button>
    </div>
  </div>

  <div id="live-view" class="fixed inset-0 bg-black z-50 hidden flex flex-col p-4 overflow-y-auto">
    <div class="sticky top-0 bg-black/90 backdrop-blur-lg z-10 border-b border-zinc-800 pb-3 mb-2 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="shrink-0 bg-red-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded tracking-widest">LIVE</span>
          <h2 id="live-title" class="text-lg font-bold text-white truncate">歌曲名稱</h2>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleSearchModal()" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 p-1.5 rounded-lg border border-zinc-800 active:scale-95 transition">
            <i data-lucide="search" class="w-4 h-4 text-blue-400"></i>
          </button>
          <span id="live-info" class="shrink-0 text-xs font-mono text-zinc-400 bg-zinc-900 px-2 py-1 rounded border border-zinc-800">原: C | 常用: C</span>
        </div>
      </div>

      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-1 border-b border-zinc-800/80" id="live-tabs-container">
      </div>

      <div class="flex items-center justify-between gap-2 pt-1">
        <div class="flex items-center gap-1 bg-zinc-900 px-2 py-1 rounded-lg border border-zinc-800 text-xs text-zinc-300">
          <span class="text-zinc-400 text-[11px]">速度</span>
          <button onclick="adjustSpeed(-1)" class="w-6 h-6 bg-zinc-800 hover:bg-zinc-700 active:scale-90 rounded flex items-center justify-center font-bold text-zinc-200">-</button>
          <span id="speed-label" class="w-5 text-center font-mono font-bold text-blue-400">5</span>
          <button onclick="adjustSpeed(1)" class="w-6 h-6 bg-zinc-800 hover:bg-zinc-700 active:scale-90 rounded flex items-center justify-center font-bold text-zinc-200">+</button>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="toggleChords()" class="bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-300 px-2 py-1.5 rounded-lg text-xs border border-zinc-800 transition">
            <span id="live-chord-toggle-text">和弦: 顯</span>
          </button>
          <button onclick="toggleTags()" class="bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-300 px-2 py-1.5 rounded-lg text-xs border border-zinc-800 transition">
            <span id="live-tag-toggle-text">標記: 顯</span>
          </button>
          <button id="live-scroll-btn" onclick="toggleScroll()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
            開始滾動
          </button>
          <button onclick="exitLiveMode()" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-zinc-300 px-2.5 py-1.5 rounded-lg text-xs border border-zinc-700 transition">
            退出
          </button>
        </div>
      </div>
    </div>

    <div id="live-lyrics-container" class="flex-1 space-y-8 text-3xl font-bold tracking-wide text-white pb-60">
    </div>
  </div>

  <div id="search-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-start justify-center p-4 pt-16">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-4 flex flex-col gap-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2 text-blue-400">
          <i data-lucide="search" class="w-5 h-5"></i>
          <h3 class="text-base font-bold text-white">搜尋曲目 (替換當前分頁)</h3>
        </div>
        <button onclick="toggleSearchModal()" class="text-slate-400 hover:text-white p-1"><i data-lucide="x"></i></button>
      </div>

      <div class="relative">
        <input id="search-input" type="text" oninput="filterSongs()" placeholder="輸入歌名或歌手關鍵字..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div id="search-results" class="max-h-60 overflow-y-auto divide-y divide-slate-800/60 rounded-xl bg-slate-950 border border-slate-800 p-1">
      </div>
    </div>
  </div>

  <script>
    let songs = [];
    let tabs = [0];
    let activeTabIndex = 0;
    
    let currentFontSize = 24;
    let isScrolling = false;
    let scrollTimer = null;
    let speedLevel = 5;
    let showChords = true;
    let showTags = true;

    const allKeys = [
      "-",
      "C", "C# / Db", "D", "D# / Eb", "E", "F", "F# / Gb", "G", "G# / Ab", "A", "A# / Bb", "B",
      "Am", "A#m / Bbm", "Bm", "Cm", "C#m", "Dm", "D#m / Ebm", "Em", "Fm", "F#m", "Gm", "G#m"
    ];

    function getScrollInterval() {
      return Math.max(10, 90 - (speedLevel * 8));
    }

    function performScroll() {
      const liveView = document.getElementById('live-view');
      const isLiveActive = !liveView.classList.contains('hidden');

      if (isLiveActive) {
        liveView.scrollTop += 1;
      } else {
        window.scrollBy(0, 1);
      }
    }

    function adjustTextareaHeight(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    window.onload = () => {
      lucide.createIcons();
      initKeySelectOptions();
      
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          toggleScroll();
        } else if (e.code === 'PageDown' || e.code === 'ArrowDown') {
          scrollPage(1);
        } else if (e.code === 'PageUp' || e.code === 'ArrowUp') {
          scrollPage(-1);
        }
      });

      db.ref('songs').on('value', (snapshot) => {
        const data = snapshot.val();
        document.getElementById('sync-status').innerText = '雲端已同步';
        document.getElementById('sync-status').className = 'text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-800';

        if (data) {
          songs = Array.isArray(data) ? data : Object.values(data);
        } else {
          songs = [{
            id: "song-1",
            title: "愛人錯過",
            artist: "告五人",
            key: "C",
            prefKey: "C",
            bpm: "120",
            lyrics: `作詞：潘雲安  作曲：潘雲安\n\n[C]我肯定在幾百年前就說過愛你\n\n[G]只是你忘了\n\n[Am]我也沒想起\n\n⭐ 重點\n\n[F]我肯定在幾百年前就說過愛你`
          }];
          db.ref('songs').set(songs);
        }
        
        updateSongSelectOptions();
        renderTabs();
        renderCurrentTabSong();
      });
    };

    function initKeySelectOptions() {
      const keySelect = document.getElementById('input-key');
      const prefKeySelect = document.getElementById('input-pref-key');
      const optionsHtml = allKeys.map(k => `<option value="${k}">${k}</option>`).join('');
      
      keySelect.innerHTML = optionsHtml;
      prefKeySelect.innerHTML = optionsHtml;
    }

    function autoSaveLyrics() {
      const lyrics = document.getElementById('input-lyrics').value;
      const currentSongIndex = tabs[activeTabIndex];
      if (songs[currentSongIndex]) {
        songs[currentSongIndex].lyrics = lyrics;
      }
    }

    function autoSaveField() {
      const title = document.getElementById('input-title').value;
      const artist = document.getElementById('input-artist').value;
      const key = document.getElementById('input-key').value;
      const prefKey = document.getElementById('input-pref-key').value;
      const bpm = document.getElementById('input-bpm').value;

      document.getElementById('song-title').innerText = title || '未命名歌曲';
      document.getElementById('song-artist').innerText = artist || '-';
      document.getElementById('song-key').innerText = key;
      document.getElementById('song-pref-key').innerText = prefKey;
      document.getElementById('song-bpm').innerText = bpm || '-';

      const currentSongIndex = tabs[activeTabIndex];
      if (songs[currentSongIndex]) {
        songs[currentSongIndex].title = title;
        songs[currentSongIndex].artist = artist;
        songs[currentSongIndex].key = key;
        songs[currentSongIndex].prefKey = prefKey;
        songs[currentSongIndex].bpm = bpm;
      }
    }

    // --- 分頁邏輯 (Tabs Logic) ---
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      const liveContainer = document.getElementById('live-tabs-container');

      const tabsHTML = tabs.map((songIndex, tIdx) => {
        const song = songs[songIndex] || { title: '未選擇' };
        const isActive = tIdx === activeTabIndex;
        const activeClass = isActive 
          ? 'bg-blue-600 text-white font-bold border-blue-500 shadow-md shadow-blue-900/30' 
          : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 border-slate-700';

        return `
          <div onclick="switchTab(${tIdx})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs cursor-pointer shrink-0 transition ${activeClass}">
            <span class="max-w-[80px] truncate">${song.title}</span>
            ${tabs.length > 1 ? `<button onclick="event.stopPropagation(); closeTab(${tIdx})" class="hover:text-red-300 p-0.5 rounded"><i data-lucide="x" class="w-3 h-3"></i></button>` : ''}
          </div>
        `;
      }).join('') + `
        <button onclick="addNewTab()" class="bg-slate-800 hover:bg-slate-700 text-blue-400 p-1.5 rounded-lg border border-slate-700 shrink-0 flex items-center justify-center">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        </button>
      `;

      container.innerHTML = tabsHTML;
      if (liveContainer) liveContainer.innerHTML = tabsHTML;
      lucide.createIcons();
    }

    function switchTab(tIdx) {
      if (isScrolling) toggleScroll();
      activeTabIndex = tIdx;
      renderTabs();
      renderCurrentTabSong();
    }

    function addNewTab() {
      tabs.push(0);
      activeTabIndex = tabs.length - 1;
      renderTabs();
      renderCurrentTabSong();
      toggleSearchModal();
    }

    function closeTab(tIdx) {
      if (tabs.length <= 1) return;
      tabs.splice(tIdx, 1);
      if (activeTabIndex >= tabs.length) {
        activeTabIndex = tabs.length - 1;
      }
      renderTabs();
      renderCurrentTabSong();
    }

    function renderCurrentTabSong() {
      const currentSongIndex = tabs[activeTabIndex];
      if (songs[currentSongIndex]) {
        renderSong(songs[currentSongIndex]);
        document.getElementById('song-select').value = currentSongIndex;
        populateRightSidebarForm(songs[currentSongIndex]);
      }
    }

    function populateRightSidebarForm(song) {
      document.getElementById('input-title').value = song.title || '';
      document.getElementById('input-artist').value = song.artist || '';
      document.getElementById('input-key').value = song.key || '-';
      document.getElementById('input-pref-key').value = song.prefKey || '-';
      document.getElementById('input-bpm').value = song.bpm || '';
      
      const lyricsInput = document.getElementById('input-lyrics');
      lyricsInput.value = song.lyrics || '';
      adjustTextareaHeight(lyricsInput);
    }

    // --- 搜尋與歌曲切換 ---
    function toggleSearchModal() {
      const modal = document.getElementById('search-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        const input = document.getElementById('search-input');
        input.value = '';
        input.focus();
        filterSongs();
      }
    }

    function filterSongs() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('search-results');
      
      const filtered = songs.map((song, index) => ({ song, index })).filter(item => {
        const title = (item.song.title || '').toLowerCase();
        const artist = (item.song.artist || '').toLowerCase();
        return title.includes(query) || artist.includes(query);
      });

      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">找不到相符歌曲</div>`;
        return;
      }

      resultsContainer.innerHTML = filtered.map(item => `
        <div onclick="selectSearchResult(${item.index})" class="p-2.5 hover:bg-slate-800/80 active:bg-slate-700 cursor-pointer flex justify-between items-center transition">
          <div>
            <div class="text-sm font-bold text-slate-100">${item.song.title}</div>
            <div class="text-xs text-slate-400">${item.song.artist || '-'}</div>
          </div>
          <span class="text-[11px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">常用: ${item.song.prefKey || item.song.key || '-'}</span>
        </div>
      `).join('');
    }

    function selectSearchResult(index) {
      tabs[activeTabIndex] = index;
      renderTabs();
      renderSong(songs[index]);
      document.getElementById('song-select').value = index;
      populateRightSidebarForm(songs[index]);
      toggleSearchModal();
    }

    function toggleChords() {
      showChords = !showChords;
      document.body.classList.toggle('hide-chords', !showChords);

      const normalText = document.getElementById('chord-toggle-text');
      const liveText = document.getElementById('live-chord-toggle-text');

      const label = showChords ? '和弦: 顯' : '和弦: 隱';
      if (normalText) normalText.innerText = label;
      if (liveText) liveText.innerText = label;
    }

    function toggleTags() {
      showTags = !showTags;
      document.body.classList.toggle('hide-tags', !showTags);

      const normalText = document.getElementById('tag-toggle-text');
      const liveText = document.getElementById('live-tag-toggle-text');

      const label = showTags ? '標記: 顯' : '標記: 隱';
      if (normalText) normalText.innerText = label;
      if (liveText) liveText.innerText = label;
    }

    function scrollPage(direction) {
      const liveView = document.getElementById('live-view');
      const isLiveActive = !liveView.classList.contains('hidden');
      const amount = (window.innerHeight * 0.7) * direction;

      if (isLiveActive) {
        liveView.scrollBy({ top: amount, behavior: 'smooth' });
      } else {
        window.scrollBy({ top: amount, behavior: 'smooth' });
      }
    }

    function updateSongSelectOptions() {
      const select = document.getElementById('song-select');
      select.innerHTML = songs.map((s, idx) => `<option value="${idx}">${s.title}</option>`).join('') + '<option value="new">+ 新增歌曲</option>';
    }

    function switchSong(value) {
      if (value === 'new') {
        openNewSongModal();
      } else {
        const index = parseInt(value);
        tabs[activeTabIndex] = index;
        renderTabs();
        renderSong(songs[index]);
        populateRightSidebarForm(songs[index]);
      }
    }

    function renderSong(song) {
      document.getElementById('song-title').innerText = song.title;
      document.getElementById('song-artist').innerText = song.artist || '-';
      document.getElementById('song-key').innerText = song.key || '-';
      document.getElementById('song-pref-key').innerText = song.prefKey || '-';
      document.getElementById('song-bpm').innerText = song.bpm || '-';

      const lyricsInput = document.getElementById('input-lyrics');
      lyricsInput.value = song.lyrics || '';
      adjustTextareaHeight(lyricsInput);

      document.getElementById('live-title').innerText = song.title;
      document.getElementById('live-info').innerText = `原: ${song.key || '-'} | 常用: ${song.prefKey || '-'} | BPM: ${song.bpm || '-'}`;
      document.getElementById('live-lyrics-container').innerHTML = generateLyricsHTML(song.lyrics, true);
    }

    function generateLyricsHTML(lyricsText, isLive = false) {
      if (!lyricsText) return '';
      const lines = lyricsText.split('\n');
      
      const tagKeywords = ['換氣', 'Mic拉遠', 'Mic靠近', '情緒', '微笑', '看觀眾', '互動', 'Solo', '吉他Solo', '鼓Fill', '升Key', '降Key', '重點', '小心高音', '放輕鬆'];

      return lines.map(line => {
        const trimmed = line.trim();
        const hasEmoji = /[\u{1F300}-\u{1F9FF}]/u.test(trimmed);
        const hasKeyword = tagKeywords.some(kw => trimmed.includes(kw));

        if ((hasEmoji || hasKeyword) && !trimmed.includes('[')) {
          return `<div class="stage-tag text-amber-400 font-bold ${isLive ? 'text-2xl py-1' : 'text-lg py-0.5'} flex items-center gap-1">${trimmed}</div>`;
        }

        let lineHtml = '<div class="flex flex-wrap items-end gap-x-3 my-2">';
        const regex = /\[(.*?)\]([^\[]*)/g;
        let match;
        let hasChord = false;

        while ((match = regex.exec(line)) !== null) {
          hasChord = true;
          lineHtml += `
            <div class="flex flex-col items-start">
              <span class="chord-label ${isLive ? 'text-blue-400 font-black text-2xl' : 'text-blue-400 font-bold text-xl'} leading-none mb-1">${match[1]}</span>
              <span>${match[2]}</span>
            </div>
          `;
        }

        if (!hasChord) {
          lineHtml += `<span>${line}</span>`;
        }
        lineHtml += '</div>';
        return lineHtml;
      }).join('');
    }

    function insertTag(tagText) {
      const textarea = document.getElementById('input-lyrics');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      
      const insertContent = `\n${tagText}\n`;
      textarea.value = text.substring(0, start) + insertContent + text.substring(end);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + insertContent.length;
      adjustTextareaHeight(textarea);
      autoSaveLyrics();
    }

    function enterLiveMode() {
      document.getElementById('normal-view').classList.add('hidden');
      document.getElementById('live-view').classList.remove('hidden');
      document.getElementById('live-view').scrollTop = 0;
    }

    function exitLiveMode() {
      if (isScrolling) toggleScroll();
      document.getElementById('live-view').classList.add('hidden');
      document.getElementById('normal-view').classList.remove('hidden');
    }

    function adjustSpeed(change) {
      speedLevel = Math.max(1, Math.min(10, speedLevel + change));
      document.getElementById('speed-label').innerText = speedLevel;
      
      if (isScrolling) {
        clearInterval(scrollTimer);
        scrollTimer = setInterval(performScroll, getScrollInterval());
      }
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(18, currentFontSize + delta), 48);
      document.getElementById('input-lyrics').style.fontSize = currentFontSize + 'px';
      adjustTextareaHeight(document.getElementById('input-lyrics'));
    }

    function toggleScroll() {
      isScrolling = !isScrolling;
      const btn = document.getElementById('scroll-btn');
      const liveBtn = document.getElementById('live-scroll-btn');

      if (isScrolling) {
        if (btn) {
          btn.classList.replace('bg-blue-600', 'bg-amber-500');
          document.getElementById('scroll-text').innerText = '暫停滾動';
        }
        if (liveBtn) {
          liveBtn.classList.replace('bg-blue-600', 'bg-amber-500');
          liveBtn.innerText = '暫停滾動';
        }
        scrollTimer = setInterval(performScroll, getScrollInterval());
      } else {
        if (btn) {
          btn.classList.replace('bg-amber-500', 'bg-blue-600');
          document.getElementById('scroll-text').innerText = '開始滾動';
        }
        if (liveBtn) {
          liveBtn.classList.replace('bg-amber-500', 'bg-blue-600');
          liveBtn.innerText = '開始滾動';
        }
        clearInterval(scrollTimer);
      }
    }

    function openNewSongModal() {
      document.getElementById('input-title').value = '';
      document.getElementById('input-artist').value = '';
      document.getElementById('input-key').value = '-';
      document.getElementById('input-pref-key').value = '-';
      document.getElementById('input-bpm').value = '';
      
      const lyricsInput = document.getElementById('input-lyrics');
      lyricsInput.value = '';
      adjustTextareaHeight(lyricsInput);
      
      document.getElementById('input-title').focus();
    }

    function saveCurrentSong() {
      const title = document.getElementById('input-title').value || '未命名歌曲';
      const artist = document.getElementById('input-artist').value || '-';
      const key = document.getElementById('input-key').value || '-';
      const prefKey = document.getElementById('input-pref-key').value || '-';
      const bpm = document.getElementById('input-bpm').value || '-';
      const lyrics = document.getElementById('input-lyrics').value || '';

      const updatedSong = { id: 'song-' + Date.now(), title, artist, key, prefKey, bpm, lyrics };
      const currentSongIndex = tabs[activeTabIndex];

      if (document.getElementById('song-select').value !== 'new' && songs[currentSongIndex]) {
        songs[currentSongIndex] = updatedSong;
      } else {
        songs.push(updatedSong);
        tabs[activeTabIndex] = songs.length - 1;
      }

      db.ref('songs').set(songs).then(() => {
        renderTabs();
        renderCurrentTabSong();
      });
    }
  </script>
</body>
</html>
