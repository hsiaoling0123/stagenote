<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StageNote - 駐唱看詞助手</title>
    <!-- PWA Web App Manifest Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (v8 Compatible) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
        .stage-tag { font-size: 1.15rem; font-weight: bold; color: #38bdf8; padding: 2px 6px; background-color: rgba(56, 189, 248, 0.1); border-radius: 4px; display: inline-block; margin-top: 6px; }
        .hl { background-color: #facc15; color: #000; font-weight: bold; padding: 0 4px; border-radius: 2px; }
        .toast { visibility: hidden; min-width: 160px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 50; bottom: 30px; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
        .toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Toast 提示框 -->
    <div id="toast" class="toast text-sm shadow-lg border border-gray-700">已儲存</div>

    <!-- 頂部導覽列 -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 flex justify-between items-center z-10 shrink-0">
        <h1 class="text-xl font-bold text-sky-400 tracking-wider">StageNote</h1>
        <div class="flex items-center gap-2">
            <!-- 登入 / 使用者狀態區塊 -->
            <div id="auth-section">
                <button id="login-btn" onclick="loginGoogle()" class="hidden bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                    Google 登入
                </button>
                <div id="user-info" class="hidden flex items-center gap-2">
                    <img id="user-avatar" class="w-7 h-7 rounded-full border border-sky-400" src="" alt="avatar">
                    <button onclick="logoutGoogle()" class="text-xs text-gray-400 hover:text-white underline">登出</button>
                </div>
            </div>
            <button id="mode-toggle-btn" onclick="toggleMode()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-sky-400 text-xs px-3 py-1.5 rounded-lg font-medium">
                進入演出模式
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左側歌單面板 -->
        <aside id="sidebar" class="w-1/3 max-w-xs bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
            <div class="p-3 border-b border-gray-800 flex gap-2">
                <input id="search-input" type="text" placeholder="搜尋歌曲/歌手..." oninput="filterSongs()" class="w-full bg-gray-800 text-sm text-gray-200 rounded px-2.5 py-1.5 outline-none focus:ring-1 focus:ring-sky-500 border border-gray-700">
                <button onclick="createNewSong()" class="bg-sky-600 text-white text-lg font-bold px-3 py-1 rounded hover:bg-sky-500 shrink-0">+</button>
            </div>
            <ul id="song-list" class="flex-1 overflow-y-auto divide-y divide-gray-800/50">
                <!-- 歌單會動態渲染於此 -->
            </ul>
        </aside>

        <!-- 右側編輯/顯示區 -->
        <main class="flex-1 flex flex-col bg-gray-950 relative overflow-hidden">
            <!-- 模式一：編輯區 -->
            <div id="editor-view" class="flex-1 flex flex-col p-4 overflow-y-auto">
                <div class="flex flex-wrap gap-2 mb-3">
                    <input id="edit-title" type="text" placeholder="歌名" oninput="autoSave()" class="flex-1 min-w-[120px] bg-gray-900 border border-gray-800 rounded px-3 py-1.5 text-lg font-bold text-white outline-none focus:border-sky-500">
                    <input id="edit-artist" type="text" placeholder="歌手" oninput="autoSave()" class="w-28 bg-gray-900 border border-gray-800 rounded px-3 py-1.5 text-sm text-gray-300 outline-none focus:border-sky-500">
                    <input id="edit-key" type="text" placeholder="Key" oninput="autoSave()" class="w-16 bg-gray-900 border border-gray-800 rounded px-2 py-1.5 text-sm text-center text-sky-400 outline-none focus:border-sky-500">
                    <input id="edit-bpm" type="number" placeholder="BPM" oninput="autoSave()" class="w-20 bg-gray-900 border border-gray-800 rounded px-2 py-1.5 text-sm text-center text-amber-400 outline-none focus:border-sky-500">
                </div>

                <!-- 編輯輔助按鈕列 -->
                <div class="flex gap-2 mb-2">
                    <button onclick="insertTag('[Intro]')" class="text-xs bg-gray-800 hover:bg-gray-700 text-sky-300 px-2 py-1 rounded border border-gray-700">+ Intro</button>
                    <button onclick="insertTag('[Verse]')" class="text-xs bg-gray-800 hover:bg-gray-700 text-sky-300 px-2 py-1 rounded border border-gray-700">+ Verse</button>
                    <button onclick="insertTag('[Chorus]')" class="text-xs bg-gray-800 hover:bg-gray-700 text-sky-300 px-2 py-1 rounded border border-gray-700">+ Chorus</button>
                    <button onclick="insertTag('[Bridge]')" class="text-xs bg-gray-800 hover:bg-gray-700 text-sky-300 px-2 py-1 rounded border border-gray-700">+ Bridge</button>
                    <button onclick="applyHighlight()" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded font-medium">螢光筆</button>
                    <button onclick="deleteCurrentSong()" class="text-xs bg-red-900/30 hover:bg-red-800/40 text-red-400 border border-red-800/50 px-2.5 py-1 rounded ml-auto">刪除歌曲</button>
                </div>

                <textarea id="edit-content" oninput="autoSave()" placeholder="在此輸入歌詞與和弦...&#10;可以使用 [[文字]] 來加上黃色螢光筆畫重點。" class="flex-1 w-full bg-gray-900 border border-gray-800 rounded p-3 text-gray-200 font-mono text-base outline-none resize-none focus:border-sky-500 leading-relaxed"></textarea>
            </div>

            <!-- 模式二：演出 Live 視圖 -->
            <div id="live-view" class="hidden flex-1 flex flex-col p-6 overflow-y-auto bg-black">
                <div class="flex justify-between items-start border-b border-gray-800 pb-3 mb-4">
                    <div>
                        <h2 id="live-title" class="text-3xl font-extrabold text-white tracking-wide">--</h2>
                        <p id="live-artist" class="text-lg text-gray-400 mt-0.5">--</p>
                    </div>
                    <div class="flex gap-3 text-right">
                        <div class="bg-sky-950/60 border border-sky-800/50 rounded-lg px-3 py-1">
                            <span class="text-xs text-sky-400 block font-semibold">KEY</span>
                            <span id="live-key" class="text-xl font-bold text-sky-200">--</span>
                        </div>
                        <div class="bg-amber-950/60 border border-amber-800/50 rounded-lg px-3 py-1">
                            <span class="text-xs text-amber-400 block font-semibold">BPM</span>
                            <span id="live-bpm" class="text-xl font-bold text-amber-200">--</span>
                        </div>
                    </div>
                </div>

                <!-- 歌詞排版渲染區 -->
                <div id="live-content" class="flex-1 text-xl leading-loose font-mono text-gray-100 whitespace-pre-wrap select-none pb-20">
                    請選取歌曲...
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase 初始化與應用程式主邏輯 -->
    <script>
        // 1. Firebase 配置 (已自動帶入你的 Firebase 設定)
        const firebaseConfig = {
            apiKey: "AIzaSyD-YOUR_API_KEY", 
            authDomain: "stagenote-eb8bf.firebaseapp.com",
            databaseURL: "https://stagenote-eb8bf-default-rtdb.firebaseio.com",
            projectId: "stagenote-eb8bf",
            storageBucket: "stagenote-eb8bf.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // 安全初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        // 全域變數
        let songs = {};
        let currentSongId = null;
        let isLiveMode = false;
        let currentUser = null;
        let saveTimeout = null;

        // 2. Auth 狀態監聽 (自動將舊訪客歌詞搬移至用戶帳號)
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userAvatar = document.getElementById('user-avatar');

            if (user) {
                // 已登入
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/150';

                // 自動搬移本地訪客歌詞 (Migration)
                const localData = localStorage.getItem('stageNote_guest_songs');
                if (localData) {
                    try {
                        const parsedLocal = JSON.parse(localData);
                        if (Object.keys(parsedLocal).length > 0) {
                            db.ref('users/' + user.uid + '/songs').update(parsedLocal).then(() => {
                                localStorage.removeItem('stageNote_guest_songs');
                                showToast('已成功將離線歌詞同步至個人雲端！');
                            });
                        }
                    } catch(e) { console.error('Data migration error', e); }
                }

                // 訂閱雲端資料庫更新
                db.ref('users/' + user.uid + '/songs').on('value', (snapshot) => {
                    songs = snapshot.val() || {};
                    renderSongList();
                    if (currentSongId && songs[currentSongId]) {
                        loadSongToView(currentSongId);
                    }
                });

            } else {
                // 未登入 (訪客模式)
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');

                // 讀取本地快取
                const localData = localStorage.getItem('stageNote_guest_songs');
                songs = localData ? JSON.parse(localData) : {};
                renderSongList();
                if (currentSongId && songs[currentSongId]) {
                    loadSongToView(currentSongId);
                }
            }
        });

        // 3. Google 登入 / 登出
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                alert('登入失敗：' + error.message);
            });
        }

        function logoutGoogle() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        // 4. 歌單管理功能
        function createNewSong() {
            const newId = 'song_' + Date.now();
            const newSong = {
                id: newId,
                title: '未命名歌曲',
                artist: '',
                key: 'C',
                bpm: '120',
                content: '[Intro]\n\n[Verse]\n'
            };

            songs[newId] = newSong;
            saveSongsData();
            selectSong(newId);
        }

        function selectSong(id) {
            currentSongId = id;
            loadSongToView(id);
            renderSongList();
        }

        function loadSongToView(id) {
            const song = songs[id];
            if (!song) return;

            // 編輯區填值
            document.getElementById('edit-title').value = song.title || '';
            document.getElementById('edit-artist').value = song.artist || '';
            document.getElementById('edit-key').value = song.key || '';
            document.getElementById('edit-bpm').value = song.bpm || '';
            document.getElementById('edit-content').value = song.content || '';

            // Live 模式填值
            document.getElementById('live-title').innerText = song.title || '無歌名';
            document.getElementById('live-artist').innerText = song.artist || '無歌手';
            document.getElementById('live-key').innerText = song.key || '-';
            document.getElementById('live-bpm').innerText = song.bpm || '-';
            
            // 處理段落標籤與螢光筆語法
            let formattedContent = (song.content || '')
                .replace(/(\[[A-Za-z0-9\s]+\])/g, '<span class="stage-tag">$1</span>')
                .replace(/\[\[(.*?)\]\]/g, '<span class="hl">$1</span>');
            
            document.getElementById('live-content').innerHTML = formattedContent;
        }

        function autoSave() {
            if (!currentSongId) return;

            songs[currentSongId] = {
                id: currentSongId,
                title: document.getElementById('edit-title').value,
                artist: document.getElementById('edit-artist').value,
                key: document.getElementById('edit-key').value,
                bpm: document.getElementById('edit-bpm').value,
                content: document.getElementById('edit-content').value
            };

            // 防抖儲存 (Debounce)
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveSongsData();
                showToast('已儲存變更');
            }, 500);
        }

        function saveSongsData() {
            if (currentUser) {
                // 儲存至 Firebase 專屬帳號資料夾
                db.ref('users/' + currentUser.uid + '/songs').set(songs);
            } else {
                // 未登入，儲存於 localStorage
                localStorage.setItem('stageNote_guest_songs', JSON.stringify(songs));
            }
            renderSongList();
        }

        function deleteCurrentSong() {
            if (!currentSongId) return;
            if (confirm('確定要刪除這首歌曲嗎？')) {
                delete songs[currentSongId];
                if (currentUser) {
                    db.ref('users/' + currentUser.uid + '/songs/' + currentSongId).remove();
                } else {
                    localStorage.setItem('stageNote_guest_songs', JSON.stringify(songs));
                }
                currentSongId = null;
                renderSongList();
                // 清空介面
                document.getElementById('edit-title').value = '';
                document.getElementById('edit-artist').value = '';
                document.getElementById('edit-key').value = '';
                document.getElementById('edit-bpm').value = '';
                document.getElementById('edit-content').value = '';
                document.getElementById('live-content').innerHTML = '請選取歌曲...';
            }
        }

        // 5. 渲染左側歌單列表
        function renderSongList() {
            const listEl = document.getElementById('song-list');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();
            listEl.innerHTML = '';

            Object.values(songs).forEach(song => {
                const title = song.title || '未命名歌曲';
                const artist = song.artist || '';

                if (title.toLowerCase().includes(searchKeyword) || artist.toLowerCase().includes(searchKeyword)) {
                    const li = document.createElement('li');
                    const isActive = song.id === currentSongId;
                    li.className = `p-3 cursor-pointer transition border-l-4 ${isActive ? 'bg-gray-800/80 border-sky-400' : 'border-transparent hover:bg-gray-800/40'}`;
                    li.onclick = () => selectSong(song.id);
                    li.innerHTML = `
                        <div class="font-bold text-sm text-gray-100 truncate">${title}</div>
                        <div class="text-xs text-gray-400 truncate flex justify-between mt-1">
                            <span>${artist || '未指定歌手'}</span>
                            <span class="text-sky-400 font-mono">${song.key ? song.key : ''}</span>
                        </div>
                    `;
                    listEl.appendChild(li);
                }
            });
        }

        function filterSongs() {
            renderSongList();
        }

        // 6. UI 輔助功能
        function toggleMode() {
            isLiveMode = !isLiveMode;
            const editorView = document.getElementById('editor-view');
            const liveView = document.getElementById('live-view');
            const btn = document.getElementById('mode-toggle-btn');
            const sidebar = document.getElementById('sidebar');

            if (isLiveMode) {
                editorView.classList.add('hidden');
                liveView.classList.remove('hidden');
                sidebar.classList.add('hidden', 'md:flex'); // Live 模式自動隱藏側邊欄以增加視野
                btn.innerText = '切換編輯模式';
                btn.className = 'bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium';
                if (currentSongId) loadSongToView(currentSongId);
            } else {
                liveView.classList.add('hidden');
                editorView.classList.remove('hidden');
                sidebar.classList.remove('hidden');
                btn.innerText = '進入演出模式';
                btn.className = 'bg-gray-800 hover:bg-gray-700 border border-gray-700 text-sky-400 text-xs px-3 py-1.5 rounded-lg font-medium';
            }
        }

        function insertTag(tagText) {
            const textarea = document.getElementById('edit-content');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + '\n' + tagText + '\n' + text.substring(end);
            autoSave();
        }

        function applyHighlight() {
            const textarea = document.getElementById('edit-content');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            
            if (selectedText) {
                const replacement = `[[${selectedText}]]`;
                textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                autoSave();
            } else {
                alert('請先用鼠標/手指選取要套用螢光筆的文字！');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 1500);
        }
    </script>
</body>
</html>
