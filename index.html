<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- Viewport 鎖定不許縮放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StageNote - 駐唱看詞助手</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap');

    *, html, body {
      touch-action: manipulation;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', Georgia, serif;
    }
    body.hide-chords .chord-label {
      display: none !important;
    }
    body.hide-tags .stage-tag {
      display: none !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .auto-expand-textarea {
      resize: none;
      overflow-y: hidden;
      min-height: 500px;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 12s linear infinite;
    }
    .immersive-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
    }
    /* 🖍️ 演出模式下的螢光筆高亮樣式 */
    .highlight-mark {
      background-color: rgba(251, 191, 36, 0.4);
      color: #fef08a;
      padding: 0px 6px;
      border-radius: 4px;
      border-bottom: 2px solid #f59e0b;
      display: inline-block;
    }
    /* 隱藏 number 輸入框預設的箭頭按鈕 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-zinc-950 text-stone-200 min-h-screen p-4 md:p-8 pb-16 font-sans select-none antialiased">

  <!-- 🔐 未登入時的登入蓋版 Modal -->
  <div id="login-overlay" class="fixed inset-0 bg-zinc-950/95 backdrop-blur-md z-[20000] flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-stone-900 border border-stone-800 rounded-3xl p-8 max-w-sm w-full shadow-2xl flex flex-col items-center gap-6">
      <div class="w-16 h-16 rounded-full bg-stone-800 border border-stone-700 flex items-center justify-center text-amber-200/90 shadow-inner">
        <i data-lucide="disc" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-2xl font-serif-tc font-bold text-stone-100">StageNote</h2>
        <p class="text-xs text-stone-400 mt-2 font-serif-tc">登入以同步雲端歌單與專屬設定</p>
      </div>

      <button onclick="loginWithGoogle()" class="w-full bg-stone-100 hover:bg-white text-zinc-950 font-semibold py-3 px-4 rounded-xl transition active:scale-95 flex items-center justify-center gap-3 shadow-lg text-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
        </svg>
        使用 Google 帳號登入
      </button>
    </div>
  </div>

  <!-- 🍞 自動消失的保存提示（Toast） -->
  <div id="toast-message" class="fixed top-6 left-1/2 -translate-x-1/2 bg-emerald-900/90 text-emerald-100 border border-emerald-500/50 px-5 py-2.5 rounded-full text-xs md:text-sm font-semibold tracking-wider shadow-2xl z-[10001] transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px] flex items-center gap-2">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-300"></i>
    <span id="toast-text">已保存！</span>
  </div>

  <!-- 🌟 載入中：歌手專屬打氣 Splash 畫面 -->
  <div id="loading-splash" class="fixed inset-0 bg-zinc-950 z-[1000] flex flex-col items-center justify-center p-6 transition-opacity duration-700 opacity-100">
    <div class="flex flex-col items-center max-w-sm text-center gap-6">
      <div class="relative flex items-center justify-center">
        <div class="w-20 h-20 rounded-full bg-stone-900 border border-stone-800 flex items-center justify-center shadow-2xl animate-spin-slow">
          <i data-lucide="disc" class="w-10 h-10 text-amber-200/80"></i>
        </div>
        <div class="absolute w-4 h-4 rounded-full bg-zinc-950 border border-stone-800"></div>
      </div>

      <div class="space-y-3">
        <h2 class="text-xs font-mono tracking-widest text-stone-500 uppercase">StageNote · Live Assistant</h2>
        <p id="cheer-message" class="text-lg md:text-xl font-serif-tc font-medium text-stone-200 leading-relaxed tracking-wider px-2">
          今夜的舞台屬於你，放輕鬆享受音樂吧。
        </p>
      </div>

      <div class="flex items-center gap-1.5 pt-4">
        <span id="loading-ping" class="w-1.5 h-1.5 rounded-full bg-amber-200/80 animate-ping"></span>
        <span id="loading-text" class="text-[11px] font-mono text-stone-500 tracking-wider">驗證身份中...</span>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSC1b6OVWEdNajEG2awFnvWQ5Wb84S620",
      authDomain: "stagenote-25687.firebaseapp.com",
      databaseURL: "https://stagenote-25687-default-rtdb.firebaseio.com",
      projectId: "stagenote-25687",
      storageBucket: "stagenote-25687.firebasestorage.app",
      messagingSenderId: "610245170171",
      appId: "1:610245170171:web:ee4548c6cb08186faef15e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;

    const cheerMessages = [
      "今夜的舞台屬於你，放輕鬆享受音樂吧。",
      "深呼吸，把心交給旋律，你會唱得很棒！",
      "每一個音符都是你的故事，今晚盡情綻放。",
      "觀眾正期待著你的聲音，上台享受這個時刻吧。",
      "台下的掌聲正為你準備著，加油！",
      "相信你的歌聲，今晚你是最耀眼的存在。",
      "享受每一個樂句，把溫暖唱進大家心裡。"
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const randomIndex = Math.floor(Math.random() * cheerMessages.length);
      const cheerEl = document.getElementById('cheer-message');
      if (cheerEl) cheerEl.innerText = cheerMessages[randomIndex];
    });

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => {
        alert("登入失敗：" + error.message);
      });
    }

    function logout() {
      if (confirm("確定要登出嗎？")) {
        auth.signOut().then(() => {
          location.reload();
        });
      }
    }
  </script>

  <!-- 常規模式 UI -->
  <div id="normal-view" class="max-w-6xl mx-auto">
    <header class="flex flex-wrap justify-between items-center border-b border-stone-800 pb-5 mb-6 gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-8 h-8 rounded-full bg-stone-800 border border-stone-700 flex items-center justify-center text-amber-200/90">
          <i data-lucide="disc" class="w-4 h-4"></i>
        </div>
        <h1 class="text-2xl font-serif-tc font-semibold tracking-widest text-stone-100">StageNote</h1>
        <span id="sync-status" class="text-[11px] bg-stone-900 text-stone-500 px-3 py-1 rounded-full border border-stone-800 font-mono">連線中...</span>
        
        <button onclick="createNewSongWithNewTab()" class="bg-stone-800 hover:bg-stone-700 text-amber-200/90 text-xs font-medium px-3.5 py-1.5 rounded-full border border-amber-500/20 active:scale-95 transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增歌曲
        </button>
      </div>

      <div class="flex items-center gap-2.5">
        <!-- 👤 會員頭像/登出按鈕 -->
        <div id="user-profile-bar" class="hidden flex items-center gap-2 bg-stone-900 px-3 py-1 rounded-full border border-stone-800">
          <img id="user-avatar" src="" class="w-5 h-5 rounded-full">
          <span id="user-name" class="text-xs font-medium text-stone-300 max-w-[80px] truncate">用戶</span>
          <button onclick="logout()" class="text-stone-500 hover:text-rose-400 p-0.5 ml-1 transition" title="登出">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <button onclick="toggleChords()" class="bg-stone-900 hover:bg-stone-800 text-stone-300 text-xs font-medium px-4 py-2 rounded-full border border-stone-800 active:scale-95 transition">
          <span id="chord-toggle-text">和弦: 顯</span>
        </button>
        <button onclick="toggleTags()" class="bg-stone-900 hover:bg-stone-800 text-stone-300 text-xs font-medium px-4 py-2 rounded-full border border-stone-800 active:scale-95 transition">
          <span id="tag-toggle-text">標記: 顯</span>
        </button>
        <button onclick="enterLiveMode()" class="bg-rose-900/80 hover:bg-rose-800 text-rose-100 text-sm font-semibold px-5 py-2 rounded-full border border-rose-700/50 flex items-center gap-1.5 active:scale-95 transition shadow-lg">
          <i data-lucide="mic" class="w-4 h-4"></i> 演出模式
        </button>
      </div>
    </header>

    <div class="flex items-center gap-2 mb-6 overflow-x-auto no-scrollbar pb-2 border-b border-stone-900" id="tabs-container">
    </div>

    <div class="flex flex-col md:flex-row gap-8 items-start relative">
      <div class="w-full md:w-6/12 lg:w-7/12 flex flex-col gap-5">
        <div class="bg-stone-900/60 border border-stone-800/80 rounded-2xl p-5 shadow-sm backdrop-blur-sm">
          <div class="flex justify-between items-start mb-4 gap-3">
            <div>
              <h2 id="song-title" class="text-2xl font-serif-tc font-bold text-stone-100 tracking-wide">載入中...</h2>
              <p id="song-artist" class="text-stone-500 text-sm mt-0.5">-</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleSearchModal()" class="bg-stone-800/80 hover:bg-stone-700 text-stone-300 p-2.5 rounded-xl border border-stone-700/60 active:scale-95 transition flex items-center gap-1.5 text-xs font-medium">
                <i data-lucide="search" class="w-3.5 h-3.5 text-amber-200/70"></i>
                <span>檢索</span>
              </button>
              <select id="song-select" onchange="switchSong(this.value)" class="bg-stone-800/80 text-stone-300 text-xs border border-stone-700/60 rounded-xl p-2.5 focus:outline-none max-w-[180px] truncate">
              </select>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 text-xs font-mono">
            <span class="bg-stone-950 px-3 py-1 rounded-lg border border-stone-800 text-stone-400">原 Key: <b id="song-key" class="text-amber-300/90 font-normal">-</b></span>
            <span class="bg-stone-950 px-3 py-1 rounded-lg border border-stone-800 text-stone-400">常用 Key: <b id="song-pref-key" class="text-emerald-300/90 font-normal">-</b></span>
            <span class="bg-stone-950 px-3 py-1 rounded-lg border border-stone-800 text-stone-400">BPM: <b id="song-bpm" class="text-stone-300 font-normal">-</b></span>
          </div>
        </div>

        <!-- 🎯 單層原生 Textarea：游標完全精準 -->
        <div class="bg-stone-900/30 border border-stone-800/60 rounded-2xl p-6 shadow-inner relative focus-within:border-stone-700 transition">
          <div class="text-[11px] text-stone-500 mb-3 font-serif-tc flex justify-between items-center tracking-widest">
            <span>✎ 點擊下方隨心編輯歌詞 (支援 [C] 和弦與 *螢光筆* 標記)</span>
          </div>
          <textarea id="input-lyrics" oninput="handleEditorInput(this)" class="auto-expand-textarea w-full bg-transparent text-xl md:text-2xl text-stone-200 font-serif-tc leading-relaxed tracking-wide focus:outline-none placeholder-stone-700" placeholder="寫下你的歌詞..."></textarea>
        </div>
      </div>

      <div class="w-full md:w-6/12 lg:w-5/12 bg-stone-900/70 border border-stone-800 rounded-2xl p-6 flex flex-col gap-6 shadow-xl sticky top-6 h-fit z-30 shrink-0">
        <!-- 頂部工具列標頭（右側放置「復原」按鈕） -->
        <div class="flex justify-between items-center border-b border-stone-800/80 pb-3">
          <h3 class="text-base font-serif-tc font-medium text-stone-200 flex items-center gap-2">
            <i data-lucide="sliders" class="w-4 h-4 text-stone-400"></i>
            作品細節與標記
          </h3>
          <div class="flex items-center gap-2">
            <button 
              onclick="undoAction()"
              class="bg-stone-800 hover:bg-stone-700 text-stone-200 font-medium active:scale-95 text-[11px] px-2.5 py-1 rounded-full border border-stone-700 transition flex items-center gap-1 shadow-sm"
              title="復原上一步"
            >
              ↩️ 復原
            </button>
            <span class="text-[10px] text-emerald-400/80 font-mono bg-emerald-950/40 px-2.5 py-0.5 rounded-full border border-emerald-900/60">即時同步</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3.5">
          <div>
            <label class="text-xs font-serif-tc text-stone-400 mb-1.5 block">歌名</label>
            <input id="input-title" type="text" oninput="autoSaveField()" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-3 py-2 text-sm text-stone-100 focus:outline-none focus:border-stone-600 transition">
          </div>
          <div>
            <label class="text-xs font-serif-tc text-stone-400 mb-1.5 block">歌手</label>
            <input id="input-artist" type="text" oninput="autoSaveField()" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-3 py-2 text-sm text-stone-100 focus:outline-none focus:border-stone-600 transition">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[11px] font-serif-tc text-stone-400 mb-1.5 block">原 Key</label>
            <select id="input-key" onchange="autoSaveField()" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-2 py-2 text-xs font-bold text-amber-300/90 focus:outline-none focus:border-stone-600 transition">
            </select>
          </div>
          <div>
            <label class="text-[11px] font-serif-tc text-stone-400 mb-1.5 block">常用 Key</label>
            <select id="input-pref-key" onchange="autoSaveField()" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-2 py-2 text-xs font-bold text-emerald-300/90 focus:outline-none focus:border-stone-600 transition">
            </select>
          </div>
          <div>
            <label class="text-[11px] font-serif-tc text-stone-400 mb-1.5 block">BPM</label>
            <input id="input-bpm" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="120" oninput="autoSaveField()" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-2 py-2 text-xs font-bold text-stone-200 focus:outline-none focus:border-stone-600 transition">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2.5">
            <label class="text-xs font-serif-tc text-amber-200/80 font-medium">🎸 快速插入和弦</label>
            <span class="text-[10px] text-stone-600">（點擊插入游標處）</span>
          </div>
          <div id="chords-list-container" class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto p-2.5 bg-stone-950/80 rounded-xl border border-stone-800/80 mb-2.5">
          </div>
          <div class="flex gap-2">
            <input id="custom-chord-input" type="text" placeholder="新增和弦 (如: Cadd9, D/F#)..." class="flex-1 bg-stone-950 border border-stone-800 rounded-xl px-3 py-1.5 text-xs text-stone-200 font-mono focus:outline-none focus:border-stone-600">
            <button onclick="addCustomChord()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-medium px-3.5 py-1.5 rounded-xl border border-stone-700 transition active:scale-95 shrink-0 flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 加和弦
            </button>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2.5">
            <label class="text-xs font-serif-tc text-amber-200/80 font-medium">插入舞台註記與畫筆</label>
            <span class="text-[10px] text-stone-600">（長按標籤可進入編輯/刪除模式）</span>
          </div>
          <div id="tags-list-container" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto p-3 bg-stone-950/80 rounded-xl border border-stone-800/80 mb-3">
          </div>
          <div class="flex gap-2">
            <input id="custom-tag-input" type="text" placeholder="輸入自訂標記 (如: 🎸 吉他獨奏)..." class="flex-1 bg-stone-950 border border-stone-800 rounded-xl px-3 py-2 text-xs text-stone-200 focus:outline-none focus:border-stone-600">
            <button onclick="addCustomTag()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-medium px-4 py-2 rounded-xl border border-stone-700 transition active:scale-95 shrink-0 flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增
            </button>
          </div>
        </div>

        <button onclick="saveCurrentSong()" class="w-full bg-stone-200 hover:bg-white text-zinc-950 font-serif-tc font-bold text-sm py-3 rounded-xl transition active:scale-95 shadow-lg mt-1 tracking-wider">
          保存作品至雲端
        </button>
      </div>

    </div>
  </div>

  <!-- 🎤 演出模式 (Live Mode) -->
  <div id="live-view" class="fixed inset-0 bg-black z-50 hidden flex flex-col h-screen w-screen overflow-hidden">
    
    <div class="bg-zinc-950/95 backdrop-blur-2xl border-b border-zinc-800/80 p-3 md:p-6 space-y-2.5 shadow-2xl shrink-0 z-50">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="shrink-0 bg-rose-900/80 text-rose-200 border border-rose-700/50 text-[10px] font-mono px-2 py-0.5 rounded-full tracking-widest">LIVE</span>
          <h2 id="live-title" class="text-2xl md:text-4xl font-serif-tc font-black text-stone-100 truncate tracking-wide">歌曲名稱</h2>
        </div>
        
        <div class="flex items-center justify-between md:justify-end gap-2 shrink-0">
          <div class="flex items-center gap-2 font-mono bg-stone-900 px-3 py-1 rounded-xl border border-stone-800 text-xs">
            <span id="live-clock" class="text-stone-300 font-bold">00:00:00</span>
          </div>

          <span id="live-info" class="text-xs md:text-lg font-mono font-medium text-stone-200 bg-stone-900 px-3 py-1 rounded-xl border border-stone-800 tracking-wide">
            原: - | 常用: -
          </span>
        </div>
      </div>

      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-1 border-b border-zinc-800/60" id="live-tabs-container">
      </div>

      <!-- 響應式工具列 -->
      <div class="flex flex-wrap md:flex-nowrap items-center justify-between gap-2 pt-1 shrink-0">
        
        <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-start shrink-0">
          <!-- 滾動速度控制 -->
          <div class="flex items-center gap-1.5 bg-stone-900 px-3 py-1.5 rounded-xl border border-stone-800 text-xs text-stone-300 flex-1 md:flex-none justify-center">
            <span class="text-stone-500 font-serif-tc text-xs">速度</span>
            <button onclick="adjustSpeed(-1)" class="w-6 h-6 bg-stone-800 hover:bg-stone-700 active:scale-90 rounded flex items-center justify-center font-bold text-stone-200">-</button>
            <span id="speed-label" class="w-4 text-center font-mono font-bold text-amber-200/90 text-xs">5</span>
            <button onclick="adjustSpeed(1)" class="w-6 h-6 bg-stone-800 hover:bg-stone-700 active:scale-90 rounded flex items-center justify-center font-bold text-stone-200">+</button>
          </div>

          <!-- 移調面板 -->
          <div class="flex items-center gap-1.5 bg-stone-900 px-3 py-1.5 rounded-xl border border-stone-800 text-xs font-mono flex-1 md:flex-none justify-center">
            <span class="text-stone-500 text-xs font-sans">移調</span>
            <button onclick="transposeKey(-1)" class="w-6 h-6 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded flex items-center justify-center font-bold active:scale-90">-</button>
            <span id="transpose-offset-label" class="w-8 text-center text-amber-300 font-bold text-xs">原Key</span>
            <button onclick="transposeKey(1)" class="w-6 h-6 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded flex items-center justify-center font-bold active:scale-90">+</button>
            <button onclick="resetTranspose()" class="text-[10px] text-stone-500 hover:text-stone-300 ml-0.5 underline">重置</button>
          </div>
        </div>

        <div class="flex items-center gap-1.5 w-full md:w-auto justify-between md:justify-end shrink-0">
          <button id="fullscreen-btn" onclick="toggleFullscreen()" class="flex-1 md:flex-none bg-stone-900 hover:bg-stone-800 active:scale-95 text-stone-300 px-2.5 py-1.5 rounded-xl text-xs font-medium border border-stone-800 transition flex items-center justify-center gap-1">
            <i data-lucide="maximize" class="w-3.5 h-3.5 text-amber-200/80"></i>
            <span id="fullscreen-btn-text">全螢幕</span>
          </button>
          
          <button onclick="toggleChords()" class="flex-1 md:flex-none bg-stone-900 hover:bg-stone-800 active:scale-95 text-stone-300 px-2.5 py-1.5 rounded-xl text-xs font-medium border border-stone-800 transition">
            <span id="live-chord-toggle-text">和弦: 顯</span>
          </button>
          <button onclick="toggleTags()" class="flex-1 md:flex-none bg-stone-900 hover:bg-stone-800 active:scale-95 text-stone-300 px-2.5 py-1.5 rounded-xl text-xs font-medium border border-stone-800 transition">
            <span id="live-tag-toggle-text">標記: 顯</span>
          </button>
          <button id="live-scroll-btn" onclick="toggleLiveScroll()" class="flex-1 md:flex-none bg-stone-200 hover:bg-white active:scale-95 text-zinc-950 px-3.5 py-1.5 rounded-xl text-xs font-serif-tc font-bold transition shadow-md whitespace-nowrap">
            開始滾動
          </button>
          <button onclick="exitLiveMode()" class="flex-1 md:flex-none bg-stone-900 hover:bg-stone-800 active:scale-95 text-stone-400 px-2.5 py-1.5 rounded-xl text-xs font-medium border border-stone-800 transition">
            退出
          </button>
        </div>

      </div>

    </div>

    <div id="live-scroll-area" class="flex-1 overflow-y-auto px-4 md:px-12 pt-6 pb-60">
      <div id="live-lyrics-container" class="space-y-6 text-2xl md:text-4xl font-serif-tc font-semibold tracking-wider text-stone-100 leading-relaxed">
      </div>
    </div>
  </div>

  <!-- 🔍 檢索視窗 Modal -->
  <div id="search-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[10000] hidden flex items-start justify-center p-4 pt-20">
    <div class="bg-stone-900 border border-stone-800 rounded-2xl w-full max-w-md p-5 flex flex-col gap-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-stone-800 pb-3">
        <div class="flex items-center gap-2 text-stone-300 font-serif-tc">
          <i data-lucide="search" class="w-4 h-4 text-amber-200/80"></i>
          <h3 class="text-sm font-semibold tracking-wider">曲目檢索</h3>
        </div>
        <button onclick="toggleSearchModal()" class="text-stone-500 hover:text-stone-200 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <div class="relative">
        <input id="search-input" type="text" oninput="filterSongs()" placeholder="搜尋歌名或歌手..." class="w-full bg-stone-950 border border-stone-800 rounded-xl px-3.5 py-2.5 text-xs text-stone-200 focus:outline-none focus:border-stone-600">
      </div>

      <div id="search-results" class="max-h-64 overflow-y-auto divide-y divide-stone-800/60 rounded-xl bg-stone-950 border border-stone-800/80 p-1">
      </div>
    </div>
  </div>

  <script>
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    let songs = [];
    let tabs = [0];
    let activeTabIndex = 0;
    
    let isScrolling = false;
    let scrollTimer = null;
    let speedLevel = 5;
    let showChords = true;
    let showTags = true;
    let isCustomFullscreen = false;

    let transposeOffset = 0;
    let toastTimer = null;
    let undoHistory = [];
    let isTagEditMode = false; // 🏷️ 標籤是否處於編輯/刪除/排序模式

    let customChords = [
      'C', 'D', 'E', 'F', 'G', 'A', 'B',
      'Cm', 'Dm', 'Em', 'Fm', 'Gm', 'Am', 'Bm',
      'C7', 'D7', 'E7', 'G7', 'A7', 'FM7', 'C/E', 'G/B', '♯', '♭'
    ];

    let customTags = [
      '🫁 換氣', '🎤 Mic拉遠', '🎤 Mic靠近', '🔥 情緒', '❤️ 微笑', 
      '👀 看觀眾', '🤝 互動', '🎸 吉他Solo', '🥁 鼓Fill', '⬆️ 升Key', 
      '⬇️ 降Key', '⭐ 重點', '⚠️ 小心高音', '😌 放輕鬆'
    ];

    const allKeys = [
      "-",
      "C", "C# / Db", "D", "D# / Eb", "E", "F", "F# / Gb", "G", "G# / Ab", "A", "A# / Bb", "B",
      "Am", "A#m / Bbm", "Bm", "Cm", "C#m", "Dm", "D#m / Ebm", "Em", "Fm", "F#m", "Gm", "G#m"
    ];

    function getUserDbRef(path) {
      if (!currentUser) return null;
      return db.ref(`users/${currentUser.uid}/${path}`);
    }

    function showToast(msg = "已保存！") {
      const toast = document.getElementById('toast-message');
      const toastText = document.getElementById('toast-text');
      if (!toast || !toastText) return;

      toastText.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
      }, 1500);
    }

    function loadLocalCache() {
      try {
        const localSongs = localStorage.getItem(`stagenote_songs_${currentUser ? currentUser.uid : 'guest'}`);
        if (localSongs) songs = JSON.parse(localSongs);

        const localChords = localStorage.getItem(`stagenote_chords_${currentUser ? currentUser.uid : 'guest'}`);
        if (localChords) customChords = JSON.parse(localChords);

        const localTags = localStorage.getItem(`stagenote_tags_${currentUser ? currentUser.uid : 'guest'}`);
        if (localTags) customTags = JSON.parse(localTags);
      } catch (e) {
        console.error("讀取本地快取失敗", e);
      }
    }

    function saveLocalCache() {
      try {
        const uid = currentUser ? currentUser.uid : 'guest';
        localStorage.setItem(`stagenote_songs_${uid}`, JSON.stringify(songs));
        localStorage.setItem(`stagenote_chords_${uid}`, JSON.stringify(customChords));
        localStorage.setItem(`stagenote_tags_${uid}`, JSON.stringify(customTags));
      } catch (e) {
        console.error("保存本地快取失敗", e);
      }
    }

    const chromaticScale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const flatScale = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeChordToken(chordStr, semitones) {
      if (semitones === 0 || !chordStr) return chordStr;
      
      return chordStr.replace(/([A-G][b#]?)/g, (match) => {
        let index = chromaticScale.indexOf(match);
        if (index === -1) index = flatScale.indexOf(match);
        if (index === -1) return match;

        let newIndex = (index + semitones) % 12;
        if (newIndex < 0) newIndex += 12;
        return chromaticScale[newIndex];
      });
    }

    function transposeKey(delta) {
      transposeOffset += delta;
      updateTransposeUI();
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        renderSong(songs[currentSongIndex]);
      }
    }

    function resetTranspose() {
      transposeOffset = 0;
      updateTransposeUI();
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        renderSong(songs[currentSongIndex]);
      }
    }

    function updateTransposeUI() {
      const label = document.getElementById('transpose-offset-label');
      if (label) {
        if (transposeOffset === 0) label.innerText = '原Key';
        else if (transposeOffset > 0) label.innerText = `+${transposeOffset}`;
        else label.innerText = `${transposeOffset}`;
      }
    }

    function initLiveClock() {
      setInterval(() => {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        const clockEl = document.getElementById('live-clock');
        if (clockEl) clockEl.innerText = timeStr;
      }, 1000);
    }

    function getScrollInterval() {
      return Math.max(10, 90 - (speedLevel * 8));
    }

    function performLiveScroll() {
      const liveScrollArea = document.getElementById('live-scroll-area');
      if (liveScrollArea) {
        liveScrollArea.scrollTop += 1;
      }
    }

    function adjustTextareaHeight(el) {
      const currentScroll = window.scrollY || document.documentElement.scrollTop;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
      window.scrollTo(0, currentScroll);
    }

    function pushUndoState() {
      const textarea = document.getElementById('input-lyrics');
      if (!textarea) return;
      if (undoHistory.length === 0 || undoHistory[undoHistory.length - 1] !== textarea.value) {
        undoHistory.push(textarea.value);
        if (undoHistory.length > 20) undoHistory.shift();
      }
    }

    function undoAction() {
      if (undoHistory.length === 0) {
        showToast("沒有上一步了！");
        return;
      }
      const textarea = document.getElementById('input-lyrics');
      const lastState = undoHistory.pop();
      textarea.value = lastState;
      adjustTextareaHeight(textarea);
      autoSaveLyrics();
      showToast("已復原上一步");
    }

    function handleEditorInput(el) {
      autoSaveLyrics();
      adjustTextareaHeight(el);
    }

    function hideLoadingSplash() {
      const splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('opacity-0');
        setTimeout(() => {
          splash.classList.add('hidden');
        }, 700);
      }
    }

    function toggleFullscreen() {
      const liveView = document.getElementById('live-view');
      isCustomFullscreen = !isCustomFullscreen;

      if (isCustomFullscreen) {
        liveView.classList.add('immersive-fullscreen');
        document.getElementById('fullscreen-btn-text').innerText = '取消全螢幕';
        
        const docEl = document.documentElement;
        const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen;
        if (req) req.call(docEl).catch(() => {});
      } else {
        liveView.classList.remove('immersive-fullscreen');
        document.getElementById('fullscreen-btn-text').innerText = '全螢幕';
        
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document).catch(() => {});
      }
    }

    // 🚀 初始化與會員資料自動搬移邏輯
    window.onload = () => {
      lucide.createIcons();
      initKeySelectOptions();
      initLiveClock();

      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          document.getElementById('login-overlay').classList.add('hidden');
          
          // 顯示個人頭像與名稱
          const profileBar = document.getElementById('user-profile-bar');
          if (profileBar) {
            profileBar.classList.remove('hidden');
            document.getElementById('user-avatar').src = user.photoURL || '';
            document.getElementById('user-name').innerText = user.displayName || '用戶';
          }

          loadLocalCache();
          renderChordsList();
          renderTagsList();

          // 📦 資料搬移檢查：如果是第一個登入的帳號，將根目錄的舊歌單移入該帳號
          db.ref('songs').once('value').then((snapshot) => {
            const rootSongs = snapshot.val();
            if (rootSongs) {
              // 搬移歌曲、和弦、標籤到當前帳號
              getUserDbRef('songs').set(rootSongs);
              db.ref('custom_chords').once('value').then((snap) => {
                if (snap.val()) getUserDbRef('custom_chords').set(snap.val());
                db.ref('custom_chords').remove();
              });
              db.ref('custom_tags').once('value').then((snap) => {
                if (snap.val()) getUserDbRef('custom_tags').set(snap.val());
                db.ref('custom_tags').remove();
              });

              // 刪除根目錄的舊全域資料，完成轉移
              db.ref('songs').remove();
              showToast("已自動將原有歌單轉移至您的帳號！");
            }
          });

          // 綁定個人的 Firebase 數據監聽
          bindUserFirebaseData();

        } else {
          // 未登入，彈出登入 Overlay
          currentUser = null;
          document.getElementById('login-overlay').classList.remove('hidden');
          hideLoadingSplash();
        }
      });
    };

    function bindUserFirebaseData() {
      const connectedRef = db.ref(".info/connected");
      connectedRef.on("value", (snap) => {
        const syncEl = document.getElementById('sync-status');
        if (snap.val() === true) {
          if (syncEl) {
            syncEl.innerText = '雲端同步完成';
            syncEl.className = 'text-[11px] bg-emerald-950/60 text-emerald-400 px-3 py-0.5 rounded-full border border-emerald-900/60 font-mono';
          }
        } else {
          if (syncEl) {
            syncEl.innerText = '離線模式 (本地快取)';
            syncEl.className = 'text-[11px] bg-amber-950/60 text-amber-400 px-3 py-0.5 rounded-full border border-amber-900/60 font-mono';
          }
          updateSongSelectOptions();
          renderTabs();
          renderCurrentTabSong();
          hideLoadingSplash();
        }
      });

      getUserDbRef('custom_chords').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          customChords = Array.isArray(data) ? data : Object.values(data);
          saveLocalCache();
        }
        renderChordsList();
      });

      getUserDbRef('custom_tags').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          customTags = Array.isArray(data) ? data : Object.values(data);
          saveLocalCache();
        }
        renderTagsList();
      });

      getUserDbRef('songs').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          songs = Array.isArray(data) ? data : Object.values(data);
          saveLocalCache();
        } else if (songs.length === 0) {
          songs = [{
            id: "song-1",
            title: "愛人錯過",
            artist: "告五人",
            key: "C",
            prefKey: "C",
            bpm: "120",
            viewCount: 1,
            lyrics: `作詞：潘雲安  作曲：潘雲安\n\n[C]我肯定在幾百年前就說過愛你\n\n[G]只是你忘了\n\n[Am]我也沒想起\n\n⭐ 重點\n\n[F]我肯定在幾百年前就說過愛你`
          }];
          getUserDbRef('songs').set(songs);
          saveLocalCache();
        }
        
        updateSongSelectOptions();
        renderTabs();
        renderCurrentTabSong();
        hideLoadingSplash();
      });
    }

    function updateSongSelectOptions() {
      const select = document.getElementById('song-select');
      const sortedSongsWithIndex = songs.map((s, idx) => ({ ...s, originalIndex: idx }))
        .sort((a, b) => (b.viewCount || 0) - (a.viewCount || 0));

      const optionsHtml = sortedSongsWithIndex.map((s) => {
        const bpmStr = s.bpm ? `${s.bpm} ` : '';
        const origKeyStr = s.key && s.key !== '-' ? `原:${s.key}` : '';
        const prefKeyStr = s.prefKey && s.prefKey !== '-' ? `樂:${s.prefKey}` : '';
        
        let keyInfo = [origKeyStr, prefKeyStr].filter(Boolean).join(' ');
        if (keyInfo) keyInfo = ` (${keyInfo})`;

        return `<option value="${s.originalIndex}">${bpmStr}${s.title}${keyInfo}</option>`;
      }).join('') + '<option value="new">+ 新增歌曲</option>';

      if (select) select.innerHTML = optionsHtml;
    }

    function incrementSongViewCount(index) {
      if (songs[index]) {
        songs[index].viewCount = (songs[index].viewCount || 0) + 1;
        saveLocalCache();
        if (navigator.onLine && currentUser) {
          getUserDbRef(`songs/${index}/viewCount`).set(songs[index].viewCount);
        }
      }
    }

    function renderChordsList() {
      const container = document.getElementById('chords-list-container');
      container.innerHTML = customChords.map((chord, idx) => `
        <button 
          id="chord-btn-${idx}"
          onclick="handleChordClick('${chord}', ${idx})"
          oncontextmenu="handleChordContextMenu(event, '${chord}', ${idx})"
          ontouchstart="handleChordTouchStart('${chord}', ${idx})"
          ontouchend="handleChordTouchEnd()"
          ontouchmove="handleChordTouchEnd()"
          class="bg-stone-900 hover:bg-amber-950/40 text-amber-200/90 hover:text-amber-200 active:scale-95 text-xs font-mono font-bold px-2.5 py-1 rounded-md border border-stone-800/80 transition"
        >
          ${chord}
        </button>
      `).join('');
    }

    let chordLongPressTimer = null;
    let isChordLongPressTriggered = false;

    function handleChordTouchStart(chord, index) {
      isChordLongPressTriggered = false;
      chordLongPressTimer = setTimeout(() => {
        isChordLongPressTriggered = true;
        confirmDeleteCustomChord(chord, index);
      }, 500);
    }

    function handleChordTouchEnd() {
      if (chordLongPressTimer) {
        clearTimeout(chordLongPressTimer);
        chordLongPressTimer = null;
      }
    }

    function handleChordClick(chord, index) {
      if (isChordLongPressTriggered) {
        isChordLongPressTriggered = false;
        return;
      }
      insertChord(chord);
    }

    function handleChordContextMenu(e, chord, index) {
      e.preventDefault();
      confirmDeleteCustomChord(chord, index);
    }

    function confirmDeleteCustomChord(chord, index) {
      if (confirm(`確定要移除快捷和弦 『${chord}』 嗎？`)) {
        customChords.splice(index, 1);
        saveLocalCache();
        if (currentUser) getUserDbRef('custom_chords').set(customChords);
      }
    }

    function addCustomChord() {
      const input = document.getElementById('custom-chord-input');
      const newChord = input.value.trim();
      if (!newChord) return;

      if (!customChords.includes(newChord)) {
        customChords.push(newChord);
        saveLocalCache();
        if (currentUser) getUserDbRef('custom_chords').set(customChords);
      }
      input.value = '';
    }

    function insertChord(chordText) {
      pushUndoState();
      const textarea = document.getElementById('input-lyrics');
      const currentWindowScroll = window.scrollY || document.documentElement.scrollTop;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      
      const insertContent = `[${chordText}]`;
      textarea.value = text.substring(0, start) + insertContent + text.substring(end);
      
      textarea.focus({ preventScroll: true });
      textarea.selectionStart = textarea.selectionEnd = start + insertContent.length;
      
      handleEditorInput(textarea);
      window.scrollTo(0, currentWindowScroll);
    }

    // 🏷️ 渲染標籤區塊（支援一般點擊插入、長安進入編輯/刪除/排序模式）
    function renderTagsList() {
      const container = document.getElementById('tags-list-container');
      
      const toolbarBtns = `
        <button 
          onclick="applyHighlight()"
          class="bg-amber-950/60 hover:bg-amber-900 text-amber-300 font-bold active:scale-95 text-xs px-3 py-1.5 rounded-lg border border-amber-700/60 transition flex items-center gap-1 shadow-sm"
        >
          🖍️ 螢光筆
        </button>
        ${isTagEditMode ? `
          <button 
            onclick="toggleTagEditMode()"
            class="bg-rose-950/80 hover:bg-rose-900 text-rose-200 font-bold active:scale-95 text-xs px-3 py-1.5 rounded-lg border border-rose-700/60 transition flex items-center gap-1 shadow-sm ml-auto"
          >
            ✓ 完成編輯
          </button>
        ` : `
          <span class="text-[10px] text-stone-500 self-center ml-auto font-serif-tc">長按標籤可編輯</span>
        `}
      `;

      const tagsHTML = customTags.map((tag, idx) => {
        if (isTagEditMode) {
          // 編輯模式：顯示刪除叉叉與左右移動按鈕
          return `
            <div class="flex items-center gap-1 bg-stone-900 border border-stone-700 rounded-lg px-2 py-1 text-xs text-stone-200">
              <span class="max-w-[80px] truncate">${tag}</span>
              <div class="flex items-center gap-0.5 ml-1 border-l border-stone-700 pl-1">
                ${idx > 0 ? `<button onclick="moveTag(${idx}, -1)" class="text-stone-400 hover:text-white px-1 text-[10px]" title="往左移">◀</button>` : ''}
                ${idx < customTags.length - 1 ? `<button onclick="moveTag(${idx}, 1)" class="text-stone-400 hover:text-white px-1 text-[10px]" title="往右移">▶</button>` : ''}
                <button onclick="deleteCustomTag(${idx})" class="text-rose-400 hover:text-rose-200 px-1 font-bold ml-0.5" title="刪除">✕</button>
              </div>
            </div>
          `;
        } else {
          // 一般模式：點擊插入，長按進入編輯
          return `
            <button 
              onclick="handleTagClick('${tag}', ${idx})"
              oncontextmenu="handleTagContextMenu(event, '${tag}', ${idx})"
              ontouchstart="handleTagTouchStart('${tag}', ${idx})"
              ontouchend="handleTagTouchEnd()"
              ontouchmove="handleTagTouchEnd()"
              class="bg-stone-900 hover:bg-stone-800 active:scale-95 text-xs font-medium px-3 py-1.5 rounded-lg text-emerald-300/90 border border-stone-800 transition select-none"
            >
              ${tag}
            </button>
          `;
        }
      }).join('');

      container.innerHTML = toolbarBtns + tagsHTML;
    }

    function toggleTagEditMode() {
      isTagEditMode = !isTagEditMode;
      renderTagsList();
    }

    let longPressTimer = null;
    let isLongPressTriggered = false;

    function handleTagTouchStart(tag, index) {
      isLongPressTriggered = false;
      longPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        // 觸發長安，進入編輯模式
        isTagEditMode = true;
        renderTagsList();
        showToast("已進入標籤編輯模式");
      }, 600);
    }

    function handleTagTouchEnd() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function handleTagClick(tag, index) {
      if (isLongPressTriggered) {
        isLongPressTriggered = false;
        return;
      }
      insertTag(tag);
    }

    function handleTagContextMenu(e, tag, index) {
      e.preventDefault();
      isTagEditMode = true;
      renderTagsList();
    }

    function deleteCustomTag(index) {
      const removed = customTags.splice(index, 1);
      saveLocalCache();
      if (currentUser) getUserDbRef('custom_tags').set(customTags);
      renderTagsList();
      showToast(`已刪除標籤: ${removed}`);
    }

    function moveTag(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= customTags.length) return;
      
      const temp = customTags[index];
      customTags[index] = customTags[targetIndex];
      customTags[targetIndex] = temp;

      saveLocalCache();
      if (currentUser) getUserDbRef('custom_tags').set(customTags);
      renderTagsList();
    }

    function addCustomTag() {
      const input = document.getElementById('custom-tag-input');
      const newTag = input.value.trim();
      if (!newTag) return;

      if (!customTags.includes(newTag)) {
        customTags.push(newTag);
        saveLocalCache();
        if (currentUser) getUserDbRef('custom_tags').set(customTags);
      }
      input.value = '';
      renderTagsList();
    }

    function applyHighlight() {
      const textarea = document.getElementById('input-lyrics');
      const currentWindowScroll = window.scrollY || document.documentElement.scrollTop;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;

      if (start === end) {
        showToast("請先框選想要高亮的文字！");
        return;
      }

      pushUndoState();

      const selectedText = text.substring(start, end);
      const cleanText = selectedText.replace(/<\/?mark>/g, '');
      const insertContent = `*${cleanText}*`;
      
      textarea.value = text.substring(0, start) + insertContent + text.substring(end);
      
      textarea.focus({ preventScroll: true });
      textarea.selectionStart = start;
      textarea.selectionEnd = start + insertContent.length;
      
      handleEditorInput(textarea);
      window.scrollTo(0, currentWindowScroll);
    }

    function initKeySelectOptions() {
      const keySelect = document.getElementById('input-key');
      const prefKeySelect = document.getElementById('input-pref-key');
      const optionsHtml = allKeys.map(k => `<option value="${k}">${k}</option>`).join('');
      
      if (keySelect) keySelect.innerHTML = optionsHtml;
      if (prefKeySelect) prefKeySelect.innerHTML = optionsHtml;
    }

    function autoSaveLyrics() {
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex === 'new' || !songs[currentSongIndex]) return;

      const textareaVal = document.getElementById('input-lyrics').value;
      if (showChords) {
        songs[currentSongIndex].lyrics = textareaVal;
        saveLocalCache();
      }
    }

    function autoSaveField() {
      const title = document.getElementById('input-title').value;
      const artist = document.getElementById('input-artist').value;
      const key = document.getElementById('input-key').value;
      const prefKey = document.getElementById('input-pref-key').value;
      const bpm = document.getElementById('input-bpm').value;

      document.getElementById('song-title').innerText = title || '新歌曲';
      document.getElementById('song-artist').innerText = artist || '-';
      document.getElementById('song-key').innerText = key;
      document.getElementById('song-pref-key').innerText = prefKey;
      document.getElementById('song-bpm').innerText = bpm || '-';

      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        songs[currentSongIndex].title = title;
        songs[currentSongIndex].artist = artist;
        songs[currentSongIndex].key = key;
        songs[currentSongIndex].prefKey = prefKey;
        songs[currentSongIndex].bpm = bpm;
        saveLocalCache();
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      const liveContainer = document.getElementById('live-tabs-container');

      const tabsHTML = tabs.map((songIndex, tIdx) => {
        let title = '新歌曲';
        if (songIndex === 'new') {
          title = '新歌曲 (未保存)';
        } else if (songs[songIndex]) {
          title = songs[songIndex].title;
        }
        
        const isActive = tIdx === activeTabIndex;
        const activeClass = isActive 
          ? 'bg-stone-200 text-zinc-950 font-serif-tc font-bold border-stone-200 shadow-md' 
          : 'bg-stone-900/80 text-stone-400 hover:bg-stone-800 border-stone-800';

        return `
          <div onclick="switchTab(${tIdx})" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full border text-xs cursor-pointer shrink-0 transition ${activeClass}">
            <span class="max-w-[100px] truncate">${title}</span>
            ${tabs.length > 1 ? `<button onclick="event.stopPropagation(); closeTab(${tIdx})" class="hover:text-rose-400 p-0.5 rounded transition"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>` : ''}
          </div>
        `;
      }).join('') + `
        <button onclick="createNewSongWithNewTab()" class="bg-stone-900 hover:bg-stone-800 text-amber-200/80 p-1.5 rounded-full border border-stone-800 shrink-0 flex items-center justify-center transition active:scale-95" title="新增分頁">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      `;

      if (container) container.innerHTML = tabsHTML;
      if (liveContainer) liveContainer.innerHTML = tabsHTML;
      lucide.createIcons();
    }

    function switchTab(tIdx) {
      if (isScrolling) toggleLiveScroll();
      resetTranspose();
      undoHistory = [];
      activeTabIndex = tIdx;
      renderTabs();
      renderCurrentTabSong();
    }

    // 🚀 修正按了新增分頁後不想新增、按叉叉或切換時會自己亂新增一頁的問題
    function createNewSongWithNewTab() {
      // 檢查目前分頁是否已經是空的「新歌曲」，如果是就不重複建立
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex === 'new') {
        showToast("目前已經在新增分頁中！");
        return;
      }

      tabs.push('new');
      activeTabIndex = tabs.length - 1;
      renderTabs();
      openNewSongForm();
    }

    function closeTab(tIdx) {
      if (tabs.length <= 1) return;
      
      // 如果關閉的是目前正在檢視的分頁，安全切換回前一個分頁
      tabs.splice(tIdx, 1);
      if (activeTabIndex >= tabs.length) {
        activeTabIndex = tabs.length - 1;
      }
      renderTabs();
      renderCurrentTabSong();
    }

    function renderCurrentTabSong() {
      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex === 'new') {
        openNewSongForm();
      } else if (songs[currentSongIndex]) {
        renderSong(songs[currentSongIndex]);
        const select = document.getElementById('song-select');
        if (select) select.value = currentSongIndex;
        populateRightSidebarForm(songs[currentSongIndex]);
      }
    }

    function populateRightSidebarForm(song) {
      const tInput = document.getElementById('input-title');
      if (!tInput) return;
      
      tInput.value = song.title || '';
      document.getElementById('input-artist').value = song.artist || '';
      document.getElementById('input-key').value = song.key || '-';
      document.getElementById('input-pref-key').value = song.prefKey || '-';
      document.getElementById('input-bpm').value = song.bpm || '';
      
      const lyricsInput = document.getElementById('input-lyrics');
      let rawLyrics = song.lyrics || '';
      lyricsInput.value = showChords ? rawLyrics : rawLyrics.replace(/\[.*?\]/g, '');
      handleEditorInput(lyricsInput);
    }

    function toggleSearchModal() {
      const modal = document.getElementById('search-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        const input = document.getElementById('search-input');
        input.value = '';
        input.focus();
        filterSongs();
      }
    }

    function filterSongs() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('search-results');
      
      const filtered = songs.map((song, index) => ({ song, index }))
        .sort((a, b) => (b.song ? (b.song.viewCount || 0) : 0) - (a.song ? (a.song.viewCount || 0) : 0))
        .filter(item => {
          const title = (item.song.title || '').toLowerCase();
          const artist = (item.song.artist || '').toLowerCase();
          return title.includes(query) || artist.includes(query);
        });

      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="p-4 text-center text-xs text-stone-600 font-serif-tc">未尋獲相關歌曲</div>`;
        return;
      }

      resultsContainer.innerHTML = filtered.map(item => `
        <div onclick="selectSearchResult(${item.index})" class="p-3 hover:bg-stone-900/90 active:bg-stone-800 cursor-pointer flex justify-between items-center transition">
          <div class="flex items-center gap-2.5">
            ${item.song.bpm ? `<span class="text-[10px] font-mono text-stone-400 bg-stone-900 border border-stone-800 px-2 py-0.5 rounded-md">${item.song.bpm}</span>` : ''}
            <div>
              <div class="text-sm font-serif-tc font-semibold text-stone-200">${item.song.title}</div>
              <div class="text-xs text-stone-500">${item.song.artist || '-'}</div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 text-xs font-mono">
            ${item.song.key && item.song.key !== '-' ? `<span class="bg-stone-900 text-amber-300/90 px-2 py-0.5 rounded border border-stone-800">原:${item.song.key}</span>` : ''}
            ${item.song.prefKey && item.song.prefKey !== '-' ? `<span class="bg-stone-900 text-emerald-300/90 px-2 py-0.5 rounded border border-stone-800">樂:${item.song.prefKey}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    function selectSearchResult(index) {
      incrementSongViewCount(index);
      tabs[activeTabIndex] = index;
      renderTabs();
      renderSong(songs[index]);
      const select = document.getElementById('song-select');
      if (select) select.value = index;
      populateRightSidebarForm(songs[index]);
      toggleSearchModal();
    }

    function toggleChords() {
      showChords = !showChords;
      document.body.classList.toggle('hide-chords', !showChords);

      const normalText = document.getElementById('chord-toggle-text');
      const liveText = document.getElementById('live-chord-toggle-text');

      const label = showChords ? '和弦: 顯' : '和弦: 隱';
      if (normalText) normalText.innerText = label;
      if (liveText) liveText.innerText = label;

      const currentSongIndex = tabs[activeTabIndex];
      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        const lyricsInput = document.getElementById('input-lyrics');
        if (lyricsInput) {
          let rawLyrics = songs[currentSongIndex].lyrics || '';
          lyricsInput.value = showChords ? rawLyrics : rawLyrics.replace(/\[.*?\]/g, '');
          handleEditorInput(lyricsInput);
        }
      }
    }

    function toggleTags() {
      showTags = !showTags;
      document.body.classList.toggle('hide-tags', !showTags);

      const normalText = document.getElementById('tag-toggle-text');
      const liveText = document.getElementById('live-tag-toggle-text');

      const label = showTags ? '標記: 顯' : '標記: 隱';
      if (normalText) normalText.innerText = label;
      if (liveText) liveText.innerText = label;
    }

    function switchSong(value) {
      if (value === 'new') {
        createNewSongWithNewTab();
      } else {
        const index = parseInt(value);
        incrementSongViewCount(index);
        tabs[activeTabIndex] = index;
        renderTabs();
        renderSong(songs[index]);
        populateRightSidebarForm(songs[index]);
      }
    }

    function renderSong(song) {
      document.getElementById('song-title').innerText = song.title;
      document.getElementById('song-artist').innerText = song.artist || '-';
      document.getElementById('song-key').innerText = song.key || '-';
      document.getElementById('song-pref-key').innerText = song.prefKey || '-';
      document.getElementById('song-bpm').innerText = song.bpm || '-';

      const lyricsInput = document.getElementById('input-lyrics');
      if (lyricsInput) {
        let rawLyrics = song.lyrics || '';
        lyricsInput.value = showChords ? rawLyrics : rawLyrics.replace(/\[.*?\]/g, '');
        handleEditorInput(lyricsInput);
      }

      document.getElementById('live-title').innerText = song.title;
      document.getElementById('live-info').innerHTML = `原: <b class="text-amber-300/90 font-mono">${song.key || '-'}</b> | 常用: <b class="text-emerald-300/90 font-mono">${song.prefKey || '-'}</b> | BPM: <b class="text-stone-300 font-mono">${song.bpm || '-'}</b>`;
      document.getElementById('live-lyrics-container').innerHTML = generateLyricsHTML(song.lyrics, true);
    }

    function generateLyricsHTML(lyricsText, isLive = false) {
      if (!lyricsText) return '';
      let cleanLyrics = lyricsText.replace(/<mark>(.*?)<\/mark>/g, '*$1*');
      const lines = cleanLyrics.split('\n');

      return lines.map(line => {
        const trimmed = line.trim();
        const hasEmoji = /[\u{1F300}-\u{1F9FF}]/u.test(trimmed);
        const isTag = customTags.some(tag => trimmed.includes(tag.replace(/[\u{1F300}-\u{1F9FF}]/u, '').trim()));

        if ((hasEmoji || isTag) && !trimmed.includes('[')) {
          return `<div class="stage-tag text-emerald-400 font-serif-tc font-bold ${isLive ? 'text-2xl md:text-4xl py-2' : 'text-xl py-1'} flex items-center gap-1.5">${trimmed}</div>`;
        }

        let lineHtml = '<div class="flex flex-wrap items-end gap-x-3.5 my-2">';
        const regex = /\[(.*?)\]([^\[]*)/g;
        let match;
        let hasChord = false;

        const renderHighlight = (str) => {
          return str.replace(/\*(.*?)\*/g, '<span class="highlight-mark">$1</span>');
        };

        while ((match = regex.exec(line)) !== null) {
          hasChord = true;
          const displayedChord = transposeOffset !== 0 ? transposeChordToken(match[1], transposeOffset) : match[1];

          lineHtml += `
            <div class="flex flex-col items-start">
              <span class="chord-label ${isLive ? 'text-amber-200/80 font-mono text-xl md:text-3xl font-bold' : 'text-amber-200/80 font-mono text-lg font-bold'} leading-none mb-1">${displayedChord}</span>
              <span>${renderHighlight(match[2])}</span>
            </div>
          `;
        }

        if (!hasChord) {
          lineHtml += `<span>${renderHighlight(line)}</span>`;
        }
        lineHtml += '</div>';
        return lineHtml;
      }).join('');
    }

    function insertTag(tagText) {
      pushUndoState();
      const textarea = document.getElementById('input-lyrics');
      const currentWindowScroll = window.scrollY || document.documentElement.scrollTop;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      
      const insertContent = `\n${tagText}\n`;
      textarea.value = text.substring(0, start) + insertContent + text.substring(end);
      
      textarea.focus({ preventScroll: true });
      textarea.selectionStart = textarea.selectionEnd = start + insertContent.length;
      
      handleEditorInput(textarea);
      window.scrollTo(0, currentWindowScroll);
    }

    function enterLiveMode() {
      document.getElementById('normal-view').classList.add('hidden');
      document.getElementById('live-view').classList.remove('hidden');
      
      const liveScrollArea = document.getElementById('live-scroll-area');
      if (liveScrollArea) liveScrollArea.scrollTop = 0;
    }

    function exitLiveMode() {
      if (isScrolling) toggleLiveScroll();
      
      if (isCustomFullscreen) {
        toggleFullscreen();
      }

      document.getElementById('live-view').classList.add('hidden');
      document.getElementById('normal-view').classList.remove('hidden');
    }

    function adjustSpeed(change) {
      speedLevel = Math.max(1, Math.min(10, speedLevel + change));
      document.getElementById('speed-label').innerText = speedLevel;
      
      if (isScrolling) {
        clearInterval(scrollTimer);
        scrollTimer = setInterval(performLiveScroll, getScrollInterval());
      }
    }

    function toggleLiveScroll() {
      isScrolling = !isScrolling;
      const liveBtn = document.getElementById('live-scroll-btn');

      if (isScrolling) {
        if (liveBtn) {
          liveBtn.classList.replace('bg-stone-200', 'bg-amber-200/90');
          liveBtn.innerText = '暫停滾動';
        }
        scrollTimer = setInterval(performLiveScroll, getScrollInterval());
      } else {
        if (liveBtn) {
          liveBtn.classList.replace('bg-amber-200/90', 'bg-stone-200');
          liveBtn.innerText = '開始滾動';
        }
        clearInterval(scrollTimer);
      }
    }

    function openNewSongForm() {
      document.getElementById('song-title').innerText = '新歌曲';
      document.getElementById('song-artist').innerText = '-';
      document.getElementById('song-key').innerText = '-';
      document.getElementById('song-pref-key').innerText = '-';
      document.getElementById('song-bpm').innerText = '-';

      document.getElementById('input-title').value = '';
      document.getElementById('input-artist').value = '';
      document.getElementById('input-key').value = '-';
      document.getElementById('input-pref-key').value = '-';
      document.getElementById('input-bpm').value = '';
      
      const lyricsInput = document.getElementById('input-lyrics');
      if (lyricsInput) {
        lyricsInput.value = '';
        handleEditorInput(lyricsInput);
      }
    }

    function saveCurrentSong() {
      const title = document.getElementById('input-title').value || '未命名歌曲';
      const artist = document.getElementById('input-artist').value || '-';
      const key = document.getElementById('input-key').value || '-';
      const prefKey = document.getElementById('input-pref-key').value || '-';
      const bpm = document.getElementById('input-bpm').value || '-';
      const lyrics = document.getElementById('input-lyrics').value || '';
      
      const currentSongIndex = tabs[activeTabIndex];
      const currentViewCount = (currentSongIndex !== 'new' && songs[currentSongIndex] && songs[currentSongIndex].viewCount) || 0;

      const updatedSong = { 
        id: 'song-' + Date.now(), 
        title, 
        artist, 
        key, 
        prefKey, 
        bpm,
        lyrics,
        viewCount: currentViewCount
      };

      if (currentSongIndex !== 'new' && songs[currentSongIndex]) {
        songs[currentSongIndex] = updatedSong;
      } else {
        songs.push(updatedSong);
        tabs[activeTabIndex] = songs.length - 1;
      }

      saveLocalCache();
      
      const onSavedComplete = () => {
        renderTabs();
        renderCurrentTabSong();
        showToast("已保存！");
      };

      if (navigator.onLine && currentUser) {
        getUserDbRef('songs').set(songs).then(onSavedComplete);
      } else {
        onSavedComplete();
      }
    }
  </script>
</body>
</html>
