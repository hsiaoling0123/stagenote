<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageNote - 駐唱看詞助手 (雲端版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-28 font-sans">

  <script>
    // 帶入妳的專屬 Firebase 設定檔
    const firebaseConfig = {
      apiKey: "AIzaSyCSC1b6OVWEdNajEG2awFnvWQ5Wb84S620",
      authDomain: "stagenote-25687.firebaseapp.com",
      databaseURL: "https://stagenote-25687-default-rtdb.firebaseio.com",
      projectId: "stagenote-25687",
      storageBucket: "stagenote-25687.firebasestorage.app",
      messagingSenderId: "610245170171",
      appId: "1:610245170171:web:ee4548c6cb08186faef15e"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>

  <!-- 頂部導覽列 -->
  <header class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
    <div class="flex items-center gap-2">
      <i data-lucide="music" class="text-blue-500"></i>
      <h1 class="text-xl font-bold tracking-wide">StageNote</h1>
      <span id="sync-status" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">連線中...</span>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleEditModal()" class="bg-slate-800 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 active:scale-95 transition">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 編輯/新增
      </button>
    </div>
  </header>

  <!-- 歌單選擇與歌曲資訊 -->
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 shadow-lg">
    <div class="flex justify-between items-start mb-2">
      <div>
        <h2 id="song-title" class="text-2xl font-bold text-white">載入中...</h2>
        <p id="song-artist" class="text-slate-400 text-sm">-</p>
      </div>
      <!-- 切換歌曲選單 -->
      <select id="song-select" onchange="switchSong(this.value)" class="bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg p-2 focus:outline-none">
        <!-- JS 自動插入選項 -->
      </select>
    </div>
    <div class="inline-block bg-slate-800 px-3 py-1 rounded-md text-xs font-mono text-slate-300">
      Key: <span id="song-key" class="text-yellow-400 font-bold">-</span>
    </div>
  </div>

  <!-- 歌詞與和弦顯示區 -->
  <main id="lyrics-container" class="leading-relaxed tracking-wider space-y-6 text-2xl">
    <!-- JS 自動解析生成 -->
  </main>

  <!-- 底部固定控制列 -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 flex justify-around items-center z-40">
    <button onclick="changeFontSize(-2)" class="p-3 bg-slate-800 rounded-full active:scale-95 transition">
      <i data-lucide="zoom-out"></i>
    </button>

    <button id="scroll-btn" onclick="toggleScroll()" class="flex items-center gap-2 px-6 py-3 rounded-full font-bold bg-blue-600 text-white active:scale-95 transition">
      <i data-lucide="play" id="scroll-icon"></i>
      <span id="scroll-text">開始滾動</span>
    </button>

    <button onclick="changeFontSize(2)" class="p-3 bg-slate-800 rounded-full active:scale-95 transition">
      <i data-lucide="zoom-in"></i>
    </button>
  </div>

  <!-- 編輯歌曲彈出視窗 (Modal) -->
  <div id="edit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-5 flex flex-col gap-4 max-h-[90vh]">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="text-lg font-bold text-white">編輯 / 新增歌曲</h3>
        <button onclick="toggleEditModal()" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">歌名</label>
          <input id="input-title" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">歌手</label>
          <input id="input-artist" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 mb-1 block">Key</label>
        <input id="input-key" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="flex-1 flex flex-col">
        <label class="text-xs text-slate-400 mb-1 block">歌詞與和弦 (格式範例: [C]我來到[G]你的城市)</label>
        <textarea id="input-lyrics" class="w-full flex-1 min-h-[180px] bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-white font-mono focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <div class="flex gap-2 justify-end pt-2">
        <button onclick="saveCurrentSong()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition">
          同步至雲端
        </button>
      </div>
    </div>
  </div>

  <script>
    let songs = [];
    let currentSongIndex = 0;
    let currentFontSize = 24;
    let isScrolling = false;
    let scrollTimer = null;

    // 初始化與 Firebase 即時監聽
    window.onload = () => {
      lucide.createIcons();
      
      // 監聽 Firebase 資料庫變動
      db.ref('songs').on('value', (snapshot) => {
        const data = snapshot.val();
        document.getElementById('sync-status').innerText = '雲端已同步';
        document.getElementById('sync-status').className = 'text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-800';

        if (data) {
          songs = Array.isArray(data) ? data : Object.values(data);
        } else {
          // 預設資料
          songs = [{
            id: "song-1",
            title: "愛錯",
            artist: "王力宏",
            key: "C#",
            lyrics: `[C] 我來到你的城市\n[G] 走過你來時的路\n[Am] 想像著沒有你的日子\n[F] 是不是會很孤獨`
          }];
          db.ref('songs').set(songs);
        }
        
        updateSongSelectOptions();
        if (songs[currentSongIndex]) {
          renderSong(songs[currentSongIndex]);
        }
      }, (error) => {
        document.getElementById('sync-status').innerText = '尚未開啟資料庫';
        document.getElementById('sync-status').className = 'text-[10px] bg-rose-950 text-rose-400 px-2 py-0.5 rounded-full border border-rose-800';
      });
    };

    function updateSongSelectOptions() {
      const select = document.getElementById('song-select');
      select.innerHTML = songs.map((s, idx) => `<option value="${idx}">${s.title}</option>`).join('') + '<option value="new">+ 新增歌曲</option>';
      select.value = currentSongIndex;
    }

    function switchSong(value) {
      if (value === 'new') {
        openNewSongModal();
      } else {
        currentSongIndex = parseInt(value);
        renderSong(songs[currentSongIndex]);
      }
    }

    function renderSong(song) {
      document.getElementById('song-title').innerText = song.title;
      document.getElementById('song-artist').innerText = song.artist;
      document.getElementById('song-key').innerText = song.key;

      const container = document.getElementById('lyrics-container');
      container.innerHTML = '';

      const lines = song.lyrics.split('\n');
      lines.forEach(line => {
        const lineDiv = document.createElement('div');
        lineDiv.className = "flex flex-wrap items-end gap-x-4";

        const regex = /\[(.*?)\]([^\[]*)/g;
        let match;
        let hasChord = false;

        while ((match = regex.exec(line)) !== null) {
          hasChord = true;
          const chordGroup = document.createElement('div');
          chordGroup.className = "flex flex-col items-start";
          chordGroup.innerHTML = `
            <span class="text-blue-400 font-bold text-xl leading-none mb-1">${match[1]}</span>
            <span>${match[2]}</span>
          `;
          lineDiv.appendChild(chordGroup);
        }

        if (!hasChord) {
          lineDiv.innerHTML = `<span>${line}</span>`;
        }

        container.appendChild(lineDiv);
      });

      document.getElementById('lyrics-container').style.fontSize = currentFontSize + 'px';
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(16, currentFontSize + delta), 40);
      document.getElementById('lyrics-container').style.fontSize = currentFontSize + 'px';
    }

    function toggleScroll() {
      isScrolling = !isScrolling;
      const btn = document.getElementById('scroll-btn');
      const text = document.getElementById('scroll-text');

      if (isScrolling) {
        btn.classList.remove('bg-blue-600');
        btn.classList.add('bg-amber-500', 'text-slate-950');
        text.innerText = '暫停滾動';
        scrollTimer = setInterval(() => { window.scrollBy({ top: 1, behavior: 'smooth' }); }, 30);
      } else {
        btn.classList.remove('bg-amber-500', 'text-slate-950');
        btn.classList.add('bg-blue-600', 'text-white');
        text.innerText = '開始滾動';
        clearInterval(scrollTimer);
      }
    }

    function toggleEditModal() {
      const modal = document.getElementById('edit-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden') && songs[currentSongIndex]) {
        const cur = songs[currentSongIndex];
        document.getElementById('input-title').value = cur.title;
        document.getElementById('input-artist').value = cur.artist;
        document.getElementById('input-key').value = cur.key;
        document.getElementById('input-lyrics').value = cur.lyrics;
      }
    }

    function openNewSongModal() {
      document.getElementById('input-title').value = '';
      document.getElementById('input-artist').value = '';
      document.getElementById('input-key').value = '';
      document.getElementById('input-lyrics').value = '';
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function saveCurrentSong() {
      const title = document.getElementById('input-title').value || '未命名歌曲';
      const artist = document.getElementById('input-artist').value || '未知歌手';
      const key = document.getElementById('input-key').value || 'C';
      const lyrics = document.getElementById('input-lyrics').value || '';

      if (document.getElementById('song-select').value !== 'new' && songs[currentSongIndex]) {
        songs[currentSongIndex] = { ...songs[currentSongIndex], title, artist, key, lyrics };
      } else {
        const newSong = { id: 'song-' + Date.now(), title, artist, key, lyrics };
        songs.push(newSong);
        currentSongIndex = songs.length - 1;
      }

      // 同步推送到 Firebase 雲端
      db.ref('songs').set(songs).then(() => {
        toggleEditModal();
      });
    }
  </script>
</body>
</html>
